/* ============================================================
   1c. SERVER SYNC — pulls/pushes the per-user data blob
   ------------------------------------------------------------
   Everything that used to be seed/demo data (conversations,
   notifications, settings, palette, profile, chat themes) now lives
   in one JSON blob on the server (see server.js's users.data column).
   hydrateFromServer() overlays that blob onto STORE/CURRENT_USER
   after login; saveUserDataToServer() pushes the current state back.
   ============================================================ */
async function hydrateFromServer(authUser){
  let res;
  try {
    res = await apiFetch("/api/me");
  } catch(e){
    actions.pushToast("Couldn't load your data: " + e.message, "error");
    return;
  }
  const data = res.data || {};

  STORE.conversations = Array.isArray(data.conversations) ? data.conversations : [];
  STORE.notifItems = Array.isArray(data.notifItems) ? data.notifItems : [];
  STORE.activeConvoId = STORE.conversations[0] ? STORE.conversations[0].id : null;

  if (data.settings){
    STORE.settings = Object.assign({}, STORE.settings, data.settings, {
      notifications: Object.assign({}, STORE.settings.notifications, data.settings.notifications),
      privacy: Object.assign({}, STORE.settings.privacy, data.settings.privacy),
      chat: Object.assign({}, STORE.settings.chat, data.settings.chat),
      accessibility: Object.assign({}, STORE.settings.accessibility, data.settings.accessibility),
      customAccent: Object.assign({}, STORE.settings.customAccent, data.settings.customAccent),
    });
  }
  if (data.palette) STORE.palette = data.palette;
  if (data.chatThemes){
    Object.entries(data.chatThemes).forEach(([convoId, theme]) => {
      const c = findConvo(convoId);
      if (c) c.theme = theme;
    });
  }
  if (data.profile) Object.assign(CURRENT_USER, data.profile);
  else {
    // Brand new account with no saved profile yet — seed it from the
    // account's registration name/username so it's not blank.
    CURRENT_USER.name = authUser.name || CURRENT_USER.name;
    CURRENT_USER.handle = authUser.username ? "@" + authUser.username : CURRENT_USER.handle;
  }
  CURRENT_USER.id = authUser.id;
  STORE.usersById[CURRENT_USER.id] = CURRENT_USER;

  // Populate display info (name/avatar/status) for every other user this
  // account shares a conversation with — direct-chat rendering looks these
  // up via STORE.usersById[c.participantIds[0]].
  if (data.otherUsersById){
    Object.entries(data.otherUsersById).forEach(([uid, u]) => { STORE.usersById[uid] = u; });
  }

  applyThemeTokens();
}

// Conversations, messages, and notifications now persist through their own
// dedicated API calls (see actions.sendMessage, toggleReaction, etc. below)
// as they happen — so this blob only needs to carry settings/profile/
// palette/chatThemes, the things that still only have a bulk save.
function getSyncableData(){
  const chatThemes = {};
  STORE.conversations.forEach(c => { if (c.theme) chatThemes[c.id] = c.theme; });
  return {
    settings: STORE.settings,
    palette: STORE.palette,
    chatThemes,
    profile: {
      name: CURRENT_USER.name, handle: CURRENT_USER.handle, bio: CURRENT_USER.bio,
      statusMessage: CURRENT_USER.statusMessage, avatarColor: CURRENT_USER.avatarColor,
      status: CURRENT_USER.status,
    },
  };
}

let _saveTimer = null;
let _lastSavedSnapshot = "";
// Debounced so rapid-fire actions (typing, theme tweaks, etc.) don't each
// trigger their own network request — this coalesces them into one.
function saveUserDataToServer(){
  return new Promise((resolve) => {
    if (_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(async () => {
      if (AUTH.status !== "authenticated") return resolve();
      const payload = getSyncableData();
      const snapshot = JSON.stringify(payload);
      if (snapshot === _lastSavedSnapshot) return resolve(); // nothing actually changed
      try {
        await apiFetch("/api/me/data", { method: "PUT", body: JSON.stringify({ data: payload }) });
        _lastSavedSnapshot = snapshot;
      } catch(e){ /* best effort — next save (or logout) will retry */ }
      resolve();
    }, 600);
  });
}

// Settings/profile/theme changes mutate STORE directly (there's no
// dedicated endpoint for every single one of those) — autosaveOnRender()
// is called from render() to catch those, on a longer debounce than direct
// saves since render() fires far more often. This does NOT cover
// conversations/messages anymore — those save immediately via their own
// API calls the moment the action happens (see below).
let _autosaveTimer = null;
function autosaveOnRender(){
  if (AUTH.status !== "authenticated") return;
  if (_autosaveTimer) clearTimeout(_autosaveTimer);
  _autosaveTimer = setTimeout(() => saveUserDataToServer(), 2000);
}

/* ============================================================
   1d. REAL-TIME LAYER (Socket.IO)
   ------------------------------------------------------------
   One socket connection per session, opened right after
   hydrateFromServer() succeeds (login/register/boot) and closed on
   logout. Incoming events patch STORE directly and re-render just
   the affected piece, the same pattern the rest of the app uses for
   local mutations — the difference is these can now arrive from
   *other* devices/users, not just this tab.
   ============================================================ */
let socket = null;

function connectSocket(){
  if (typeof io === "undefined") return; // CDN blocked/offline — app still works, just without live push
  const token = getToken();
  if (!token) return;
  if (socket) { socket.disconnect(); socket = null; }

  socket = io(API_BASE || undefined, { auth: { token }, transports: ["websocket", "polling"] });

  socket.on("message:new", (msg) => {
    const c = findConvo(msg.conversationId);
    if (!c) return; // conversation not loaded yet — a conversation:created event will bring it in
    if (c.messages.some(m => m.id === msg.id)) return; // already have it (e.g. this tab sent it)
    c.messages.push(normalizeIncomingMessage(msg));
    c.lastMessageAt = msg.ts;
    if (STORE.activeConvoId === msg.conversationId){
      renderChat(); renderChatMessagesOnly();
    } else if (msg.senderId !== CURRENT_USER.id){
      c.unread = (c.unread || 0) + 1;
    }
    renderConvoList();
  });

  socket.on("message:updated", (msg) => {
    const c = findConvo(msg.conversationId);
    if (!c) return;
    const idx = c.messages.findIndex(m => m.id === msg.id);
    if (idx === -1) return;
    c.messages[idx] = normalizeIncomingMessage(msg);
    if (STORE.activeConvoId === msg.conversationId) renderChatMessagesOnly();
  });

  socket.on("message:deleted", ({ conversationId, messageId }) => {
    const c = findConvo(conversationId);
    if (!c) return;
    const m = c.messages.find(m => m.id === messageId);
    if (m){ m.deleted = true; m.text = ""; m.attachment = null; m.reactions = []; }
    c.pinnedMessageIds = (c.pinnedMessageIds || []).filter(id => id !== messageId);
    if (STORE.activeConvoId === conversationId) renderChatMessagesOnly();
  });

  socket.on("message:reaction_added", ({ conversationId, messageId, userId, emoji }) => {
    applyReactionDelta(conversationId, messageId, userId, emoji, true);
  });
  socket.on("message:reaction_removed", ({ conversationId, messageId, userId, emoji }) => {
    applyReactionDelta(conversationId, messageId, userId, emoji, false);
  });

  socket.on("message:pinned", ({ conversationId, messageId }) => {
    const c = findConvo(conversationId);
    if (!c) return;
    c.pinnedMessageIds = c.pinnedMessageIds || [];
    if (!c.pinnedMessageIds.includes(messageId)) c.pinnedMessageIds.push(messageId);
    if (STORE.activeConvoId === conversationId) renderChat();
  });
  socket.on("message:unpinned", ({ conversationId, messageId }) => {
    const c = findConvo(conversationId);
    if (!c) return;
    c.pinnedMessageIds = (c.pinnedMessageIds || []).filter(id => id !== messageId);
    if (STORE.activeConvoId === conversationId) renderChat();
  });

  socket.on("conversation:created", (detail) => {
    if (findConvo(detail.conversation.id)) return;
    STORE.conversations.unshift(normalizeIncomingConversation(detail));
    renderConvoList();
  });
  socket.on("conversation:updated", (detail) => {
    const c = findConvo(detail.conversation.id);
    if (!c) return;
    Object.assign(c, normalizeIncomingConversation(detail, c));
    if (STORE.activeConvoId === c.id) renderChat();
    renderConvoList();
  });
  socket.on("conversation:member_role_changed", ({ conversationId, userId, role }) => {
    const c = findConvo(conversationId);
    if (!c) return;
    c.roles = c.roles || {};
    c.roles[userId] = role;
    if (STORE.activeConvoId === conversationId) renderInfoPanelBodyOnly();
  });
  socket.on("conversation:member_removed", ({ conversationId, userId }) => {
    const c = findConvo(conversationId);
    if (!c) return;
    c.participantIds = (c.participantIds || []).filter(id => id !== userId);
    if (c.roles) delete c.roles[userId];
    if (STORE.activeConvoId === conversationId) { renderInfoPanelBodyOnly(); render(); }
  });
  socket.on("conversation:removed", ({ conversationId }) => {
    STORE.conversations = STORE.conversations.filter(c => c.id !== conversationId);
    if (STORE.activeConvoId === conversationId){
      STORE.activeConvoId = (STORE.conversations[0]||{}).id || null;
      STORE.mobileView = "list";
    }
    render();
    actions.pushToast("You were removed from a conversation", "info");
  });

  socket.on("presence:update", ({ userId, status }) => {
    const u = STORE.usersById[userId];
    if (u) u.status = status;
    if (STORE.activeConvoId){
      const c = findConvo(STORE.activeConvoId);
      if (c && c.type === "direct" && (c.participantIds||[])[0] === userId) renderChat();
    }
  });

  socket.on("typing:update", ({ conversationId, userId, typing }) => {
    const c = findConvo(conversationId);
    if (!c) return;
    c.typingUserIds = c.typingUserIds || [];
    c.typingUserIds = typing
      ? Array.from(new Set([...c.typingUserIds, userId]))
      : c.typingUserIds.filter(id => id !== userId);
    c.typing = c.typingUserIds.length > 0;
    if (STORE.activeConvoId === conversationId) renderChatMessagesOnly();
  });

  socket.on("notification:new", (n) => {
    STORE.notifItems.unshift({
      id: n.id, type: n.type, conversationId: n.conversationId, messageId: n.messageId,
      actorId: n.actorId, preview: n.preview, read: false, createdAt: n.createdAt,
      ts: new Date(n.createdAt).getTime(),
    });
    if (STORE.view === "notifications") renderNotifications();
    renderSidebarChrome();
  });

  // Socket.IO does not replay events missed while disconnected (a laptop
  // sleeping, a Render free-tier instance spinning down, a flaky network).
  // On every reconnect, re-fetch the open conversation's latest messages
  // and the full conversation list so nothing sent during the gap is lost —
  // this is a full resync, not an attempt to diff/patch the gap precisely.
  socket.on("connect", () => {
    if (socket.recovered) return; // first-ever connect in this session, nothing to resync
    resyncAfterReconnect();
  });
}

async function resyncAfterReconnect(){
  try {
    const listRes = await apiFetch("/api/conversations");
    const serverConvos = listRes.conversations || [];
    serverConvos.forEach(sc => {
      const existing = findConvo(sc.id);
      if (existing){
        existing.lastMessageAt = sc.lastMessageAt;
        existing.unread = sc.unreadCount;
      }
    });
    if (STORE.activeConvoId){
      const c = findConvo(STORE.activeConvoId);
      if (c){
        const res = await apiFetch(`/api/conversations/${STORE.activeConvoId}/messages?limit=100`);
        const fresh = (res.messages || []).map(normalizeIncomingMessage);
        // Keep any not-yet-reconciled optimistic/local messages (temp-/local-
        // ids never made it to the server, so they won't be in `fresh`).
        const pending = c.messages.filter(m => m.id.startsWith("temp-") || m.id.startsWith("local-"));
        c.messages = [...fresh, ...pending];
        renderChatMessagesOnly();
      }
    }
    renderConvoList();
  } catch (e) { /* best effort — next successful action will re-sync naturally */ }
}

function disconnectSocket(){
  if (socket){ socket.disconnect(); socket = null; }
}

// Converts a message object as returned by the API/socket (ts already in
// ms, replyTo already embedded — see server.js hydrateMessages()) into
// exactly the shape the renderer expects. Mostly a pass-through; exists as
// one place to adapt if the wire shape ever drifts from the render shape.
function normalizeIncomingMessage(msg){
  return {
    id: msg.id, senderId: msg.senderId, type: msg.type === "system" ? "system" : undefined,
    text: msg.text, ts: msg.ts, status: msg.status || "sent",
    edited: !!msg.edited, deleted: !!msg.deleted,
    replyTo: msg.replyTo || null,
    mentions: msg.mentions || [],
    reactions: msg.reactions || [],
    attachment: msg.attachment
      ? { kind: msg.attachment.kind, name: msg.attachment.name, url: msg.attachment.url, size: msg.attachment.sizeBytes, color: "#7C5CFC" }
      : null,
  };
}

function applyReactionDelta(conversationId, messageId, userId, emoji, added){
  const c = findConvo(conversationId);
  if (!c) return;
  const m = c.messages.find(m => m.id === messageId);
  if (!m) return;
  if (!m.reactions) m.reactions = [];
  let r = m.reactions.find(r => r.emoji === emoji);
  if (added){
    if (!r){ r = { emoji, userIds: [] }; m.reactions.push(r); }
    if (!r.userIds.includes(userId)) r.userIds.push(userId);
  } else if (r){
    r.userIds = r.userIds.filter(id => id !== userId);
  }
  m.reactions = m.reactions.filter(r => r.userIds.length > 0);
  if (STORE.activeConvoId === conversationId) renderChatMessagesOnly();
}

// Converts a conversation "detail" object (as returned by
// POST/GET /api/conversations...) into the flat shape the renderer
// expects (participantIds instead of a members array, roles as a plain
// map, etc.), merging onto an existing conversation object if one is
// passed so in-flight local state like `.messages` isn't clobbered.
function normalizeIncomingConversation(detail, existing){
  const convo = detail.conversation;
  const roles = {};
  (detail.members || []).forEach(m => {
    roles[m.userId] = m.role;
    if (!STORE.usersById[m.userId] || m.userId !== CURRENT_USER.id){
      STORE.usersById[m.userId] = Object.assign({}, STORE.usersById[m.userId], {
        id: m.userId, name: m.name, handle: "@" + m.username, avatarColor: m.avatarColor, status: m.status,
      });
    }
  });
  const participantIds = (detail.members || []).map(m => m.userId).filter(id => id !== CURRENT_USER.id);
  return Object.assign({}, existing, {
    id: convo.id, type: convo.type, name: convo.name, description: convo.description,
    groupAvatarColor: convo.groupAvatarColor, privacy: convo.privacy,
    permissions: {
      whoCanSend: convo.whoCanSend, whoCanAddMembers: convo.whoCanAddMembers, whoCanEditInfo: convo.whoCanEditInfo,
    },
    createdAt: convo.createdAt ? new Date(convo.createdAt).getTime() : (existing && existing.createdAt) || Date.now(),
    roles, participantIds,
    pinnedMessageIds: detail.pinnedMessageIds || (existing && existing.pinnedMessageIds) || [],
    messages: (existing && existing.messages) || [],
    unread: (existing && existing.unread) || 0,
    pinned: (existing && existing.pinned) || false,
    muted: (existing && existing.muted) || false,
    archived: (existing && existing.archived) || false,
  });
}

/* ============================================================
   PART 5A: STORAGE ABSTRACTION LAYER (frontend-only, replaceable)
   ------------------------------------------------------------
   Every part of the app that needs to persist something talks to
   `Storage`, never to localStorage directly. Storage.get/set/remove/
   clear is the entire surface a future backend/API-backed storage
   implementation needs to match — swap the bodies of these four
   methods for real HTTP calls and nothing else in the app changes.

   Namespacing: all keys are prefixed "echo:" so clear() can safely
   wipe only this app's data. Auth tokens are handled entirely by
   AuthService (see Part auth) and never pass through here — this
   layer is for display/customization preferences only.
   ============================================================ */
const Storage = {
  _prefix: "echo:",
  get(key, fallback){
    try {
      const raw = localStorage.getItem(this._prefix + key);
      if (raw == null) return fallback !== undefined ? fallback : null;
      return JSON.parse(raw);
    } catch(e){ return fallback !== undefined ? fallback : null; }
  },
  set(key, value){
    try {
      localStorage.setItem(this._prefix + key, JSON.stringify(value));
      return true;
    } catch(e){ return false; /* storage unavailable — caller's data simply won't persist */ }
  },
  remove(key){
    try { localStorage.removeItem(this._prefix + key); return true; }
    catch(e){ return false; }
  },
  clear(){
    try {
      Object.keys(localStorage)
        .filter(k => k.startsWith(this._prefix))
        .forEach(k => localStorage.removeItem(k));
      return true;
    } catch(e){ return false; }
  },
};

// Settings/profile/chat-theme persistence now goes to the server (one user
// account can then follow you across devices/browsers, instead of each
// browser tab having its own separate localStorage copy). These three
// functions keep their original names/call sites — only the body changed —
// so nothing elsewhere in the app needed to be touched. Real hydration of
// this data happens post-login via hydrateFromServer(), not at page-parse
// time, since there's no logged-in user yet when this script first runs.
function savePersistedSettings(){ saveUserDataToServer(); }

// Theme tokens are applied immediately (rather than waiting until the
// bottom of the script) so nothing else can paint or measure layout before
// <html> carries the correct theme/density/font-size attributes — this is
// what prevents a wrong-theme flash on startup. Uses STORE's defaults until
// hydrateFromServer() overlays the signed-in user's saved preferences.
applyThemeTokens();

function effectiveTheme(){
  if (STORE.settings.theme !== "system") return STORE.settings.theme;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
}

function applyThemeTokens(){
  const root = document.documentElement;
  root.setAttribute("data-palette", STORE.palette);
  root.setAttribute("data-theme", effectiveTheme());
  root.setAttribute("data-density", STORE.settings.density);
  root.setAttribute("data-font-size", STORE.settings.fontSize);
  root.classList.toggle("reduce-motion", !!STORE.settings.accessibility.reduceMotion);
  root.classList.toggle("high-contrast", !!STORE.settings.accessibility.highContrast);

  // Custom accent colors layer on top of the selected preset as inline CSS
  // custom properties — same tokens (--primary/--primary-2) every component
  // already reads, so nothing downstream needs to know custom colors exist.
  const custom = STORE.settings.customAccent || {};
  if (custom.primary) root.style.setProperty("--primary", custom.primary); else root.style.removeProperty("--primary");
  if (custom.secondary) root.style.setProperty("--primary-2", custom.secondary); else root.style.removeProperty("--primary-2");
}
function applyThemeTokensSmoothly(){
  document.documentElement.classList.add("theme-transitioning");
  applyThemeTokens();
  setTimeout(() => document.documentElement.classList.remove("theme-transitioning"), 320);
}
if (window.matchMedia){
  window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => {
    if (STORE.settings.theme === "system") applyThemeTokensSmoothly();
  });
}

  async sendMessage(convoId, text){
    const hasAttachments = STORE.pendingAttachments.length > 0;
    if (!text.trim() && !hasAttachments) return;
    const c = findConvo(convoId);
    if (!c) return;
    const replyTo = STORE.replyTo
      ? { id: STORE.replyTo.id, text: STORE.replyTo.text, senderId: STORE.replyTo.senderId }
      : null;
    const replyToMessageId = STORE.replyTo ? STORE.replyTo.id : undefined;

    // Attachments here are local-only previews (no upload pipeline is wired
    // up yet — "attach file" just queues a name/size, there's no real file
    // storage to upload to). They render locally but are NOT sent to the
    // server, since the backend requires a real hosted url for an
    // attachment. Text-only sends are fully real end-to-end.
    const attachmentsToSend = STORE.pendingAttachments.filter(a => a.progress >= 100 && !a.error);
    const trimmedText = text.trim();

    STORE.replyTo = null;
    STORE.pendingAttachments = [];

    if (attachmentsToSend.length){
      // Local-preview-only path (see note above) — kept so the composer's
      // attachment queue still visibly "sends" instead of silently doing
      // nothing, but this is clearly not persisted.
      attachmentsToSend.forEach((a, i) => {
        c.messages.push({
          id: "local-" + Math.random().toString(36).slice(2),
          senderId: CURRENT_USER.id,
          text: i === 0 ? trimmedText : "",
          ts: Date.now(), status: "sent", replyTo,
          attachment: { kind: a.kind, name: a.name, size: a.size, color: "#7C5CFC" },
          localOnly: true,
        });
      });
      renderChat(); renderConvoList();
      actions.pushToast("File attachments aren't uploaded to the server yet — this message is local to your device only.", "info");
      return;
    }

    // Optimistic send: show the message immediately with a temporary id,
    // then reconcile with the server's real id/timestamp once the request
    // resolves. On failure, mark it failed in place rather than silently
    // dropping it, so the user can retry or see it didn't go through.
    const tempId = "temp-" + Math.random().toString(36).slice(2);
    const optimistic = {
      id: tempId, senderId: CURRENT_USER.id, text: trimmedText,
      ts: Date.now(), status: "sending", replyTo, attachment: null,
    };
    c.messages.push(optimistic);
    c.lastMessageAt = optimistic.ts;
    renderChat();
    renderConvoList();

    try {
      const res = await apiFetch(`/api/conversations/${convoId}/messages`, {
        method: "POST",
        body: JSON.stringify({ text: trimmedText, replyToMessageId }),
      });
      const idx = c.messages.findIndex(m => m.id === tempId);
      if (idx !== -1) c.messages[idx] = normalizeIncomingMessage(res.message);
      c.lastMessageAt = res.message.ts;
    } catch (err) {
      const failed = c.messages.find(m => m.id === tempId);
      if (failed) failed.status = "failed";
      actions.pushToast("Message didn't send — " + (err.message || "please try again"), "error");
    }
    renderChatMessagesOnly();
    renderConvoList();
  },

  // Re-sends a message that previously failed (status === "failed"),
  // reusing the same optimistic-then-reconcile flow as sendMessage.
  async retryMessage(convoId, tempId){
    const c = findConvo(convoId);
    if (!c) return;
    const msg = c.messages.find(m => m.id === tempId);
    if (!msg || msg.status !== "failed") return;
    msg.status = "sending";
    renderChatMessagesOnly();
    try {
      const res = await apiFetch(`/api/conversations/${convoId}/messages`, {
        method: "POST",
        body: JSON.stringify({ text: msg.text, replyToMessageId: msg.replyTo ? msg.replyTo.id : undefined }),
      });
      const idx = c.messages.findIndex(m => m.id === tempId);
      if (idx !== -1) c.messages[idx] = normalizeIncomingMessage(res.message);
      c.lastMessageAt = res.message.ts;
    } catch (err) {
      msg.status = "failed";
      actions.pushToast("Still couldn't send — " + (err.message || "please try again"), "error");
    }
    renderChatMessagesOnly();
    renderConvoList();
  },

  async editMessage(convoId, msgId, newText){
    const c = findConvo(convoId);
    if (!c) return;
    const m = c.messages.find(m => m.id === msgId);
    if (!m || !newText.trim()) { STORE.editingId = null; renderChat(); return; }
    if (msgId.startsWith("temp-") || msgId.startsWith("local-")){
      actions.pushToast("Please wait for the message to finish sending first", "info");
      return;
    }
    const previousText = m.text;
    m.text = newText.trim(); m.edited = true; // optimistic
    STORE.editingId = null;
    renderChat();
    renderConvoList();
    try {
      const res = await apiFetch(`/api/conversations/${convoId}/messages/${msgId}`, {
        method: "PATCH", body: JSON.stringify({ text: newText.trim() }),
      });
      const idx = c.messages.findIndex(m => m.id === msgId);
      if (idx !== -1) c.messages[idx] = normalizeIncomingMessage(res.message);
    } catch (err) {
      const failedMsg = c.messages.find(m => m.id === msgId);
      if (failedMsg) { failedMsg.text = previousText; }
      actions.pushToast("Couldn't save the edit — " + (err.message || "please try again"), "error");

  async deleteMessage(convoId, msgId){
    const c = findConvo(convoId);
    if (!c) return;
    const m = c.messages.find(m => m.id === msgId);
    if (!m) return;
    STORE.messageMenuId = null;
    if (msgId.startsWith("temp-") || msgId.startsWith("local-")){
      // Never made it to the server — just drop it locally.
      c.messages = c.messages.filter(m => m.id !== msgId);
      renderChat(); renderConvoList();
      return;
    }
    // Marked deleted rather than removed, so the timeline shows an honest
    // "this message was deleted" placeholder instead of silently vanishing.
    const snapshot = { text: m.text, attachment: m.attachment, reactions: m.reactions, deleted: m.deleted };
    m.deleted = true; m.text = ""; m.attachment = null; m.reactions = [];
    c.pinnedMessageIds = (c.pinnedMessageIds || []).filter(id => id !== msgId);
    renderChat();
    renderConvoList();
    try {
      await apiFetch(`/api/conversations/${convoId}/messages/${msgId}`, { method: "DELETE" });
      actions.pushToast("Message deleted", "success");
    } catch (err) {
      Object.assign(m, snapshot); // roll back
      renderChat(); renderConvoList();
      actions.pushToast("Couldn't delete the message — " + (err.message || "please try again"), "error");
    }
  },

  /* ================================================================
     PART 4 — group/channel creation wizard, invites, member management
     Group/channel creation and member management call the real
     /api/conversations endpoints — STORE is updated from the server's
     response, not invented locally, so roles/ids match what's actually
     persisted.
     ================================================================ */
  openNewDirect(){
    STORE.newDirect = { mode: "direct", conversationId: null, query: "", results: [], loading: false, creating: false };
    STORE.modal = { type: "newDirect" };
    renderModal();
    // Synchronous focus — see the comment in openGlobalSearch() above for why
    // this must not be wrapped in setTimeout.
    const el = document.getElementById("new-direct-search");
    if (el) el.focus();
  },
  openAddMembers(convoId){
    const c = findConvo(convoId);
    if (!c) return;
    if (!canManageMembers(c)) return actions.pushToast("Only admins can add members", "error");
    STORE.newDirect = { mode: "addToConversation", conversationId: convoId, query: "", results: [], loading: false, creating: false };
    STORE.modal = { type: "newDirect" };
    renderModal();
    const el = document.getElementById("new-direct-search");
    if (el) el.focus();
  },
  setNewDirectQuery(q){
    const s = STORE.newDirect;
    if (!s) return;
    s.query = q;
    if (s._debounce) clearTimeout(s._debounce);
    const term = q.trim();
    if (!term){
      s.results = []; s.loading = false;
      const el = document.getElementById("new-direct-results");
      if (el) el.innerHTML = emptyStateHtml("users", "Find someone to message", "Search by name or username.");
      return;
    }
    s.loading = true;
    const resultsEl = document.getElementById("new-direct-results");
    if (resultsEl) resultsEl.innerHTML = emptyStateHtml("loader", "Searching…", "");
    s._debounce = setTimeout(async () => {
      try {
        const res = await apiFetch(`/api/users/search?q=${encodeURIComponent(term)}`);
        if (STORE.newDirect !== s || s.query.trim() !== term) return; // stale response / modal closed
        let results = res.users || [];
        if (s.mode === "addToConversation" && s.conversationId){
          const c = findConvo(s.conversationId);
          const existingIds = new Set(c ? c.participantIds : []);
          results = results.filter(u => !existingIds.has(u.id));
        }
        s.results = results;
      } catch (e) {
        s.results = [];
      } finally {
        s.loading = false;
        const el = document.getElementById("new-direct-results");
        if (el) el.innerHTML = STORE.newDirect === s ? newDirectResultsHtml(s) : "";
      }
    }, 300);
  },
  async startDirectWith(userId){
    const s = STORE.newDirect;
    if (!s || s.creating) return;
    s.creating = true;
    const el = document.getElementById("new-direct-results");
    if (el) el.innerHTML = newDirectResultsHtml(s);

    if (s.mode === "addToConversation" && s.conversationId){
      const convoId = s.conversationId;
      const c = findConvo(convoId);
      try {
        await apiFetch(`/api/conversations/${convoId}/members`, {
          method: "POST", body: JSON.stringify({ userIds: [userId] }),
        });
        if (c && !c.participantIds.includes(userId)) c.participantIds.push(userId);
        if (c) { c.roles = c.roles || {}; c.roles[userId] = "member"; }
        const u = (s.results || []).find(u => u.id === userId);
        if (u) STORE.usersById[userId] = Object.assign({}, STORE.usersById[userId], u);
        STORE.modal = null; STORE.newDirect = null;
        renderModal();
        renderInfoPanelBodyOnly();
        actions.pushToast("Member added", "success");
      } catch (err) {
        s.creating = false;
        actions.pushToast("Couldn't add member — " + (err.message || "please try again"), "error");
        const el2 = document.getElementById("new-direct-results");
        if (el2) el2.innerHTML = newDirectResultsHtml(s);
      }
      return;
    }

    try {
      const detail = await apiFetch("/api/conversations", {
        method: "POST", body: JSON.stringify({ type: "direct", memberId: userId }),
      });
      const existing = findConvo(detail.conversation.id);
      const convo = existing
        ? Object.assign(existing, normalizeIncomingConversation(detail, existing))
        : normalizeIncomingConversation(detail);
      if (!existing) STORE.conversations.unshift(convo);
      STORE.modal = null; STORE.newDirect = null;
      renderModal();
      STORE.view = "chats";
      actions.openConversation(convo.id);
    } catch (err) {
      s.creating = false;
      actions.pushToast("Couldn't start conversation — " + (err.message || "please try again"), "error");
      const el2 = document.getElementById("new-direct-results");
      if (el2) el2.innerHTML = newDirectResultsHtml(s);
    }
  },

  async removeMemberFromGroup(convoId, userId){

    if (!c) return;
    if (!canManageMembers(c)) return actions.pushToast("Only admins can remove members", "error");

    const previousRole = c.roles ? c.roles[userId] : undefined;

      render();
      actions.pushToast("Couldn't remove member — " + (err.message || "please try again"), "error");
    }
  },
  setGroupPrivacy(convoId, value){
    const c = findConvo(convoId);
    if (!c) return;
    if (!canManageMembers(c)) return actions.pushToast("Only admins can change privacy", "error");
    c.privacy = value;
    renderInfoPanelBodyOnly();
  },
  setGroupPermission(convoId, key, value){
    const c = findConvo(convoId);
    if (!c) return;
    if (!canManageMembers(c)) return actions.pushToast("Only admins can change permissions", "error");
    c.permissions = c.permissions || {};
    c.permissions[key] = value;
    renderInfoPanelBodyOnly();
    renderChat();
  },
  setGroupColor(convoId, color){
    const c = findConvo(convoId);
    if (!c) return;
    if (!canManageMembers(c)) return actions.pushToast("Only admins can customize this " + c.type, "error");
    c.groupAvatarColor = color;
    renderInfoPanelBodyOnly();
    render();
  },
  leaveGroup(convoId){
    const c = findConvo(convoId);
    if (!c) return;
    STORE.conversations = STORE.conversations.filter(x => x.id !== convoId);
    if (STORE.activeConvoId === convoId) STORE.activeConvoId = (STORE.conversations[0]||{}).id;
    STORE.panelOpen = false; STORE.modal = null;
    STORE.mobileView = "list";
    render();
    renderModal();
    actions.pushToast(`You left ${convoTitle(c)}`, "info");
  },
};

function esc(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

/* ---- Part 5A: profile field validation ---- */
function normalizeHandle(raw){
  let h = (raw || "").trim();
  if (!h) return CURRENT_USER.handle;
  if (!h.startsWith("@")) h = "@" + h;
  return h;
}
function validateProfileDraft(d){
  const errors = [];
  const name = (d.name || "").trim();
  if (!name) errors.push("Display name can't be empty");
  else if (name.length > 60) errors.push("Display name must be 60 characters or fewer");

  const handleBody = (d.handle || "").trim().replace(/^@/, "");
  if (handleBody && !/^[a-zA-Z0-9_.]{2,30}$/.test(handleBody)){
    errors.push("Username can only contain letters, numbers, underscores, and periods");
  }
  if ((d.bio || "").length > 160) errors.push("Bio must be 160 characters or fewer");
  if ((d.statusMessage || "").length > 80) errors.push("Status must be 80 characters or fewer");
  return errors;
}

function initials(name){
  return (name || "").split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();
}
function formatTime(ts){
  const d = new Date(ts);
  const h = d.getHours(); const m = String(d.getMinutes()).padStart(2,"0");
  const h12 = h % 12 || 12;
  return `${h12}:${m} ${h < 12 ? "AM" : "PM"}`;
}
function formatRelative(ts){
  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if (diffMin < 1) return "now";
  if (diffMin < 60) return diffMin + "m";
  const diffH = Math.floor(diffMin/60);
  if (diffH < 24) return diffH + "h";
  return Math.floor(diffH/24) + "d";
}
function convoTitle(c){
  if (c.type === "direct") return (STORE.usersById[c.participantIds[0]] || {}).name || "Unknown";
  return c.name;
}
function convoColor(c){
  if (c.type === "direct") return (STORE.usersById[c.participantIds[0]] || {}).avatarColor || "#7C5CFC";
  return c.groupAvatarColor || "#7C5CFC";
}
function lastMessage(c){ return c.messages[c.messages.length - 1]; }

/* ---- PART 4: group/channel role & permission helpers ----
   Frontend-only model: everything below reads/writes STORE state and never
   claims to be enforced server-side. A real backend would own roles and
   permissions and these helpers would become thin wrappers over API calls. */
const GROUP_COLORS = ["#7C5CFC","#22D3EE","#F0577A","#34D399","#FBBF24","#FB7185"];

function roleOf(c, userId){
  return (c.roles && c.roles[userId]) || "member";
}
function isAdmin(c, userId){ return roleOf(c, userId) === "admin"; }
function isModerator(c, userId){ return ["admin","moderator"].includes(roleOf(c, userId)); }
function canManageMembers(c){ return isAdmin(c, CURRENT_USER.id); }
function canPostIn(c){
  if (c.type !== "channel") return true;
  if (!c.permissions || c.permissions.whoCanSend === "everyone") return true;
  return isModerator(c, CURRENT_USER.id);
}
function defaultPermissionsFor(type){
  return {
    whoCanSend: type === "channel" ? "admins" : "everyone",
    whoCanAddMembers: "admins",
    whoCanEditInfo: "admins",
  };
}
// Deterministic, replaceable "invite link" abstraction — a real backend
// would issue/rotate a signed token; this only fabricates something that
// looks like one, scoped to the conversation id.
function generateInviteLink(c){
  if (!c.inviteToken) c.inviteToken = Math.random().toString(36).slice(2, 9);
  return `echo.chat/invite/${c.inviteToken}`;
}
function memberCountLabel(c){
  const n = c.participantIds.length + 1;
  return c.type === "channel" ? `${n} subscriber${n!==1?'s':''}` : `${n} member${n!==1?'s':''}`;
}
function isMobile(){ return window.innerWidth < 860; }
// Three-tier layout mode used to decide how the contextual panel is presented:
// mobile → dedicated full-screen; tablet → floating overlay; desktop → docked column.
function panelMode(){
  const w = window.innerWidth;
  if (w < 860) return "mobile";
  if (w < 1180) return "tablet";
  return "desktop";
}

function iconSvg(name, size){

/* Live per-field validation + submit handling, wired fresh on every render
   since the form markup is rebuilt each time. Kept intentionally simple:
   this is presentation-layer validation only, not a security boundary. */
function bindAuthForm(){
  const form = document.getElementById("auth-form");
  if (!form) return;

  // password visibility toggles
  form.querySelectorAll('[data-action="toggleVisibility"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.innerHTML = iconSvg(showing ? "eye" : "eye-off", 17);
      refreshIcons();
    });
  });

  // remember-me / terms checkboxes
  const rememberRow = form.querySelector('[data-action="toggleRemember"]');
  if (rememberRow){
    rememberRow.addEventListener("click", () => {
      AUTH._remember = !AUTH._remember;
      document.getElementById("remember-checkbox").classList.toggle("checked", AUTH._remember);
    });
  }
  const termsRow = form.querySelector('[data-action="toggleTerms"]');
  if (termsRow){
    termsRow.addEventListener("click", () => {
      AUTH._termsAccepted = !AUTH._termsAccepted;
      document.getElementById("terms-checkbox").classList.toggle("checked", AUTH._termsAccepted);
      setFieldError("terms", null);
    });
  }

  // password strength meter (signup + reset)
  const pwField = form.querySelector('#signup-password, #reset-password');
  if (pwField){
    pwField.addEventListener("input", () => updateStrengthMeter(pwField.value));
  }

  // clear individual field errors as the person types
  form.querySelectorAll(".auth-input").forEach(inp => {
    inp.addEventListener("input", () => {
      inp.classList.remove("invalid");
      const msg = document.getElementById(inp.id + "-msg");
      if (msg) msg.innerHTML = "";
    });
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    handleAuthSubmit(AUTH.screen, form);
  });
}

function updateStrengthMeter(value){
  const segs = document.querySelectorAll("#password-strength .auth-strength-seg");
  if (!segs.length) return;
  const score = authValidators.passwordStrength(value); // 0..4
  const tier = score <= 1 ? "weak" : score <= 2 ? "fair" : "strong";
  segs.forEach((seg, i) => {
    seg.className = "auth-strength-seg" + (i < score ? ` filled-${tier}` : "");
  });
}

function setFieldError(id, message){
  const input = document.getElementById(id);
  const msg = document.getElementById(id + "-msg");
  if (input) input.classList.toggle("invalid", !!message);
  if (msg) msg.innerHTML = message ? `<div class="auth-error-text">${iconSvg("alert-circle",12)}${esc(message)}</div>` : "";
}

function handleAuthSubmit(screen, form){
  const val = (id) => (document.getElementById(id) || {}).value || "";
  let valid = true;
  const fail = (id, message) => { setFieldError(id, message); valid = false; };

  if (screen === "login"){
    const identifier = val("login-identifier").trim();
    const password = val("login-password");
    if (!authValidators.required(identifier)) fail("login-identifier", "Enter your email or username.");
    if (!authValidators.required(password)) fail("login-password", "Enter your password.");
    else if (!authValidators.minLen(password, 8)) fail("login-password", "Password must be at least 8 characters.");
    if (!valid) return;
    authActions.login({ identifier, password });

  } else if (screen === "signup"){
    const name = val("signup-name").trim();
    const username = val("signup-username").trim();
    const email = val("signup-email").trim();
    const password = val("signup-password");
    const confirm = val("signup-confirm");
    if (!authValidators.required(name)) fail("signup-name", "Enter your display name.");
    if (!authValidators.required(username)) fail("signup-username", "Choose a username.");
    else if (!authValidators.username(username)) fail("signup-username", "3–20 characters: letters, numbers, underscores only.");
    if (!authValidators.required(email)) fail("signup-email", "Enter your email address.");
    else if (!authValidators.email(email)) fail("signup-email", "Enter a valid email address.");
    if (!authValidators.required(password)) fail("signup-password", "Create a password.");
    else if (!authValidators.minLen(password, 8)) fail("signup-password", "Password must be at least 8 characters.");
    if (!authValidators.required(confirm)) fail("signup-confirm", "Confirm your password.");
    else if (password !== confirm) fail("signup-confirm", "Passwords don't match.");
    if (!AUTH._termsAccepted){ setFieldError("terms", "You must accept the terms to continue."); valid = false; }
    if (!valid) return;
    authActions.register({ displayName:name, username, email, password });

  } else if (screen === "forgot"){
    const email = val("forgot-email").trim();
    if (!authValidators.required(email)) fail("forgot-email", "Enter your email address.");
    else if (!authValidators.email(email)) fail("forgot-email", "Enter a valid email address.");
    if (!valid) return;
    authActions.requestReset(email);

  } else if (screen === "reset"){
    const password = val("reset-password");
    const confirm = val("reset-confirm");
    if (!authValidators.required(password)) fail("reset-password", "Create a new password.");
    else if (!authValidators.minLen(password, 8)) fail("reset-password", "Password must be at least 8 characters.");
    if (!authValidators.required(confirm)) fail("reset-confirm", "Confirm your new password.");
    else if (password !== confirm) fail("reset-confirm", "Passwords don't match.");
    if (!valid) return;
    authActions.resetPassword({ token: AUTH._resetToken || "demo-reset-token", password });

  } else if (screen === "verify"){
    const code = val("verify-code").trim();
    if (!authValidators.required(code)) fail("verify-code", "Enter the verification code.");
    if (!valid) return;
    authActions.verifyEmail(code);
  }
}

  nav.outerHTML = tmp.firstElementChild.outerHTML;
  refreshIcons();
}

/* ============================================================
   5. RENDER — CONVERSATION LIST
   ============================================================ */
function getFilteredConversations(){
  let list = STORE.conversations;
  if (STORE.view === "communities") list = list.filter(c => c.type === "group");
  if (STORE.view === "channels") list = list.filter(c => c.type === "channel");
  if (STORE.view === "favorites") list = list.filter(c => c.favorited);
  // Archived conversations are hidden from every other view — they only
  // surface here, same convention as the pre-existing "archived" filter.
  list = STORE.view === "archived" ? list.filter(c => c.archived) : list.filter(c => !c.archived);
  if (STORE.filter === "unread") list = list.filter(c => c.unread > 0);
  if (STORE.filter === "groups") list = list.filter(c => c.type === "group" || c.type === "channel");
  if (STORE.filter === "favorites") list = list.filter(c => c.favorited);
  if (STORE.activeFolderId) list = list.filter(c => c.folderId === STORE.activeFolderId);
  if (STORE.searchQuery.trim()){
    const q = STORE.searchQuery.toLowerCase();
    list = list.filter(c => convoTitle(c).toLowerCase().includes(q));
  }
  return [...list].sort((a,b) => {
    if (a.pinned !== b.pinned) return b.pinned - a.pinned; // pinned always float to top
    if (STORE.sortBy === "unread") return (b.unread>0) - (a.unread>0) || b.unread - a.unread;
    if (STORE.sortBy === "name") return convoTitle(a).localeCompare(convoTitle(b));
    return ((lastMessage(b)||{}).ts||0) - ((lastMessage(a)||{}).ts||0); // 'recent' (default)
  });
}

function previewText(last){
  if (!last) return "No messages yet";
  if (last.type === "system") return last.text;
  if (last.deleted) return "This message was deleted";
  if (last.attachment) return `📎 ${last.attachment.kind === "image" ? "Photo" : last.attachment.kind === "video" ? "Video" : last.attachment.name}${last.text ? " · " + last.text : ""}`;
  return last.text;
}

function convoItemHtml(c){
  const title = convoTitle(c);
  const color = convoColor(c);
  const last = lastMessage(c);
  const isMe = last && last.senderId === CURRENT_USER.id;
  const senderName = last && last.type !== "system" ? (isMe ? "You" : ((STORE.usersById[last.senderId]||{}).name||"").split(" ")[0]) : "";
  const iconName = c.type === "channel" ? "hash" : c.type === "group" ? "users" : null;
  const status = c.type === "direct" ? (STORE.usersById[c.participantIds[0]]||{}).status : null;

  return `
    <button class="convo-item ${c.id===STORE.activeConvoId?'active':''}" data-action="openConvo" data-id="${c.id}">
      ${avatarHtml({ name: title, color, size:46, status, iconName })}
      <div class="convo-main">
        <div class="convo-top-row">
          <span class="convo-name">${c.pinned ? iconSvg("map-pin",11) : ""}${c.favorited ? iconSvg("star",11) : ""}${esc(title)}</span>
          <span class="convo-time">${last ? formatRelative(last.ts) : ""}</span>
        </div>
        <div class="convo-bottom-row">
          <span class="convo-preview ${c.typing?'typing':''}">${
            c.typing ? "typing…" : esc(`${senderName ? senderName+": " : ""}${previewText(last)}`)
          }</span>
          <div class="convo-meta">
            ${c.muted ? iconSvg("volume-x",13) : ""}
            ${c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : ""}
          </div>
        </div>
      </div>
    </button>`;
}

function renderConvoList(){
  const el = document.getElementById("convo-list-root");
  if (!el) return;
  // Bug fix: previously this function force-focused #search-input on every
  // call, including re-renders triggered by unrelated actions (switching nav
  // views, selecting a conversation, window resize). That stole focus back
  // into the search box the instant a person clicked away from it, making
  // search feel impossible to exit. Now we only restore focus if the input
  // genuinely had focus (and a live cursor position) right before this
  // render — i.e. the person was actively typing — and never force it open.
  const prevSearch = document.getElementById("search-input");
  const hadFocus = !!prevSearch && document.activeElement === prevSearch;
  const prevSelStart = hadFocus ? prevSearch.selectionStart : null;
  const prevSelEnd = hadFocus ? prevSearch.selectionEnd : null;

  const headerLabels = { communities:"Groups", channels:"Channels", contacts:"Contacts", archived:"Archived", favorites:"Favorites" };
  const headerLabel = headerLabels[STORE.view] || "Chats";
  const filtered = getFilteredConversations();

  let bodyHtml;
  if (STORE.view === "contacts"){
    bodyHtml = STORE.users.map(u => `
      <div class="member-row" style="padding:10px 8px;">
        ${avatarHtml({ name:u.name, color:u.avatarColor, size:42, status:u.status })}
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text-primary)">${esc(u.name)}</div>
          <div style="font-size:12px;color:var(--text-tertiary);font-family:var(--font-mono)">${esc(u.handle)}</div>
        </div>
      </div>`).join("");
  } else if (filtered.length > 0){
    bodyHtml = filtered.map(convoItemHtml).join("");
  } else {
    bodyHtml = STORE.filter === "unread"
      ? emptyStateHtml("check-square", "All caught up", "Nothing unread right now.")
      : STORE.filter === "favorites" || STORE.view === "favorites"
        ? emptyStateHtml("star", "No favorites yet", "Star a conversation to pin it here.")
        : STORE.view === "archived"
          ? emptyStateHtml("archive", "No archived conversations", "Conversations you archive will appear here.")
          : STORE.view === "channels"
            ? emptyStateHtml("hash", "No channels yet", "Channels you join or create will appear here.")
            : STORE.view === "communities"
              ? emptyStateHtml("users", "No groups yet", "Groups you join or create will appear here.")
              : STORE.activeFolderId
                ? emptyStateHtml("folder", "Folder is empty", "Move conversations here from the chat menu.")
                : emptyStateHtml("message-circle", "No conversations", "Start a new conversation to see it here.");
  }

  el.innerHTML = `
    <div class="convo-list-header">
      <div class="convo-list-title-row">
        <h1 class="convo-list-title">${headerLabel}</h1>
        <button class="icon-btn" data-action="newConvo" aria-label="New conversation" title="New conversation">${iconSvg("plus")}</button>
      </div>
      <div class="search-wrap">
        ${iconSvg("search",16)}
        <input class="input ${STORE.searchQuery ? 'has-clear' : ''}" id="search-input" type="text" placeholder="Search conversations" aria-label="Search conversations" value="${esc(STORE.searchQuery)}" />
        ${STORE.searchQuery ? `<button class="search-clear-btn" id="search-clear-btn" type="button" aria-label="Clear search" title="Clear search">${iconSvg("x", 14)}</button>` : ""}
      </div>
      <button style="display:flex;align-items:center;gap:6px;padding:5px 10px 7px;background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:12px;font-family:var(--font-mono);width:100%;border-radius:var(--radius-sm);transition:color .12s;"
        data-action="openGlobalSearch" title="Search messages, people and files">
        ${iconSvg("zap",11)} Search all messages &amp; files <span style="margin-left:auto;padding:1px 5px;border-radius:4px;background:var(--surface-elevated);border:1px solid var(--border);font-size:10px;">⌘K</span>
      </button>
      ${STORE.view === "chats" ? `
        <div class="filter-row" style="align-items:center;">
          <button class="filter-chip ${STORE.filter==='all'?'active':''}" data-action="setFilter" data-filter="all">All</button>
          <button class="filter-chip ${STORE.filter==='unread'?'active':''}" data-action="setFilter" data-filter="unread">Unread</button>
          <button class="filter-chip ${STORE.filter==='groups'?'active':''}" data-action="setFilter" data-filter="groups">Groups</button>
          <button class="filter-chip ${STORE.filter==='favorites'?'active':''}" data-action="setFilter" data-filter="favorites">${iconSvg('star',11)} Favorites</button>
          <select class="input" style="margin-left:auto;width:auto;padding:5px 8px;font-size:11px;" data-action-el="sortSelect" aria-label="Sort conversations">
            <option value="recent" ${STORE.sortBy==='recent'?'selected':''}>Recent</option>
            <option value="unread" ${STORE.sortBy==='unread'?'selected':''}>Unread first</option>
            <option value="name" ${STORE.sortBy==='name'?'selected':''}>Name (A–Z)</option>
          </select>
        </div>
        ${STORE.folders.length ? `
        <div class="filter-row" style="margin-top:6px;">
          ${STORE.folders.map(f => `
            <button class="filter-chip ${STORE.activeFolderId===f.id?'active':''}" data-action="setActiveFolder" data-folder="${f.id}">
              <span style="width:7px;height:7px;border-radius:50%;background:${f.color};display:inline-block;margin-right:5px;"></span>${esc(f.name)}
            </button>`).join("")}
        </div>` : ""}` : ""}
    </div>
    <div class="convo-scroll scroll">${bodyHtml}</div>
  `;
  const sortSelect = document.querySelector("[data-action-el='sortSelect']");
  if (sortSelect) sortSelect.addEventListener("change", (e) => actions.setSortBy(e.target.value));
  const search = document.getElementById("search-input");
  if (search){
    search.addEventListener("input", (e) => { STORE.searchQuery = e.target.value; renderConvoListBodyAndClear(); });
    // Enter opens the top filtered result rather than doing nothing (there's
    // no <form> here, so Enter previously had no effect at all).
    search.addEventListener("keydown", (e) => {
      if (e.key === "Escape"){ STORE.searchQuery = ""; renderConvoList(); search.blur(); return; }
      if (e.key !== "Enter") return;
      e.preventDefault();
      const top = getFilteredConversations()[0];
      if (top) actions.openConversation(top.id);
    });
    if (hadFocus){
      search.focus();
      search.setSelectionRange(prevSelStart, prevSelEnd);
    }
  }
  const clearBtn = document.getElementById("search-clear-btn");
  if (clearBtn){
    clearBtn.addEventListener("click", () => {
      STORE.searchQuery = "";
      renderConvoList();
    });
  }
  refreshIcons();
}

// Re-render the scrollable body AND the clear-button visibility, without
// touching focus — used while the person is actively typing.
function renderConvoListBodyAndClear(){
  renderConvoListBodyOnly();
  const wrap = document.querySelector("#convo-list-root .search-wrap");
  if (!wrap) return;
  const existingBtn = document.getElementById("search-clear-btn");
  const input = document.getElementById("search-input");
  if (input) input.classList.toggle("has-clear", !!STORE.searchQuery);
  if (STORE.searchQuery && !existingBtn){
    const btn = document.createElement("button");
    btn.className = "search-clear-btn";
    btn.id = "search-clear-btn";
    btn.type = "button";
    btn.setAttribute("aria-label", "Clear search");
    btn.title = "Clear search";
    btn.innerHTML = iconSvg("x", 14);
    wrap.appendChild(btn);
    refreshIcons();
    btn.addEventListener("click", () => { STORE.searchQuery = ""; renderConvoList(); });
  } else if (!STORE.searchQuery && existingBtn){
    existingBtn.remove();
  }
}

// Re-render only the scrollable body (keeps input focus while typing)
function renderConvoListBodyOnly(){
  const scrollEl = document.querySelector("#convo-list-root .convo-scroll");
  if (!scrollEl) return;
  const filtered = getFilteredConversations();
  scrollEl.innerHTML = filtered.length
    ? filtered.map(convoItemHtml).join("")
    : (STORE.filter === "unread"
        ? emptyStateHtml("check-square", "All caught up", "Nothing unread right now.")
        : emptyStateHtml("message-circle", "No conversations", "Start a new conversation to see it here."));
  refreshIcons();
}

function highlightMentionsAndSearch(text, mentions, searchQuery){
  let out = esc(text);
  if (mentions && mentions.length){
    out = out.replace(/@(\w+(?:\s\w+)?|everyone)/g, (match) => `<span class="msg-mention">${match}</span>`);
  }
  if (searchQuery && searchQuery.trim()){
    const q = esc(searchQuery.trim());
    try {
      const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      out = out.replace(re, "<mark class=\"msg-search-hit\">$1</mark>");
    } catch(e){}
  }
  return out;
}

function dateSeparatorHtml(ts){
  const d = new Date(ts);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  const sameDay = (a,b) => a.toDateString() === b.toDateString();
  let label;
  if (sameDay(d, today)) label = "Today";
  else if (sameDay(d, yest)) label = "Yesterday";
  else label = d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
  return `<div class="date-separator"><span>${label}</span></div>`;
}

function systemMessageHtml(m){

  }
  if (att.kind === "video"){
    return `
      <div class="attachment-media video" style="background:linear-gradient(135deg, #7C5CFC55, #22D3EE22); cursor:pointer;"

function reactionsRowHtml(m){

function messageBubbleHtml(m, c, showAvatar){
  if (m.type === "system") return systemMessageHtml(m);

  const isMe = m.senderId === CURRENT_USER.id;
  const sender = STORE.usersById[m.senderId] || {};
  const isEditing = STORE.editingId === m.id;
  const isPinned = (c.pinnedMessageIds||[]).includes(m.id);
  const isSearchHit = STORE.chatSearch.results[STORE.chatSearch.index] === m.id && STORE.chatSearch.open;

  if (m.deleted){
    return `
      <div class="msg-row ${isMe?'me':''}" data-msgid="${m.id}">
        <div class="msg-avatar-slot">${showAvatar && !isMe ? avatarHtml({ name:sender.name, color:sender.avatarColor, size:28 }) : ""}</div>
        <div class="msg-col ${isMe?'me':'other'}">
          <div class="msg-bubble deleted">${iconSvg("slash",13)} This message was deleted</div>
          <div class="msg-footer"><span class="msg-time">${formatTime(m.ts)}</span></div>
        </div>
      </div>`;
  }

  const replyHtml = m.replyTo ? `<div class="msg-reply-preview">${esc(m.replyTo.text)}</div>` : "";
  const statusIcon = isMe
    ? (m.status === "read" ? `<span style="color:var(--info)">${iconSvg("check-check",13)}</span>`
      : m.status === "delivered" ? `<span style="color:var(--text-tertiary)">${iconSvg("check-check",13)}</span>`
      : m.status === "sending" ? `<span style="color:var(--text-tertiary)" class="msg-sending-icon">${iconSvg("clock",12)}</span>`
      : m.status === "failed" ? `<span style="color:var(--error)">${iconSvg("alert-circle",13)}</span>`
      : `<span style="color:var(--text-tertiary)">${iconSvg("check",13)}</span>`)
    : "";

  const bodyHtml = isEditing ? `
    <div style="display:flex;gap:6px;align-items:center;">
      <input class="input" id="edit-input-${m.id}" value="${esc(m.text)}" style="min-width:180px;border-color:var(--primary);background:var(--surface-solid);" />
      <button class="icon-btn" data-action="saveEdit" data-msgid="${m.id}" aria-label="Save edit">${iconSvg("check",16)}</button>
      <button class="icon-btn" data-action="cancelEdit" aria-label="Cancel edit">${iconSvg("x",16)}</button>
    </div>
  ` : `
    <div class="msg-bubble ${isMe?'me':'other'} ${m.attachment?'has-attachment':''}">
      ${m.attachment ? attachmentCardHtml(m.attachment) : ""}
      ${m.text ? `<div class="${m.attachment?'msg-caption':''}">${highlightMentionsAndSearch(m.text, m.mentions, STORE.chatSearch.open ? STORE.chatSearch.query : "")}</div>` : ""}
    </div>
  `;

  const actionsHtml = isEditing ? "" : `
    <div class="msg-actions">
      <button class="icon-btn" data-action="toggleReactionPicker" data-msgid="${m.id}" aria-label="React" title="React">${iconSvg("smile",14)}</button>
      <button class="icon-btn" data-action="replyTo" data-msgid="${m.id}" aria-label="Reply" title="Reply">${iconSvg("corner-up-left",14)}</button>
      <div style="position:relative;">
        <button class="icon-btn" data-action="toggleMessageMenu" data-msgid="${m.id}" aria-label="More actions" title="More">${iconSvg("more-horizontal",14)}</button>
        ${messageMenuHtml(m, isMe, c)}
      </div>
    </div>`;

  return `
    <div class="msg-row ${isMe?'me':''} ${isSearchHit?'msg-row-active-hit':''}" data-msgid="${m.id}">
      <div class="msg-avatar-slot">${showAvatar && !isMe ? avatarHtml({ name:sender.name, color:sender.avatarColor, size:28 }) : ""}</div>
      <div class="msg-col ${isMe?'me':'other'}" style="position:relative;">
        ${showAvatar && !isMe ? `<span class="msg-sender">${esc(sender.name||"")}</span>` : ""}
        ${replyHtml}
        ${bodyHtml}
        ${reactionPickerHtml(m)}
        <div class="msg-footer">
          ${isPinned ? iconSvg("pin", 10) : ""}
          <span class="msg-time">${formatTime(m.ts)}${m.edited ? " · edited" : ""}${m.status==='sending' ? " · sending…" : ""}${m.status==='failed' ? " · failed to send" : ""}</span>
          ${statusIcon}
        </div>
        ${reactionsRowHtml(m)}
      </div>
      ${actionsHtml}
    </div>`;
}

function messagesTimelineHtml(c){
  let html = "";
  let lastDateKey = null;
  c.messages.forEach((m, i) => {
    const dateKey = new Date(m.ts).toDateString();
    if (dateKey !== lastDateKey){ html += dateSeparatorHtml(m.ts); lastDateKey = dateKey; }
    const isMe = m.senderId === CURRENT_USER.id;
    const prev = c.messages[i-1];
    const showAvatar = !isMe && (!prev || prev.senderId !== m.senderId || prev.type === "system");
    html += messageBubbleHtml(m, c, showAvatar);
  });
  if (c.typing) html += typingRowHtml(c);
  return html;
}

function renderChat(){
  const el = document.getElementById("chat-root");
  if (!el) return;
  const c = findConvo(STORE.activeConvoId);

  if (!c){
    el.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;">${
      emptyStateHtml("message-circle", "Select a conversation", "Choose a chat from the list to start messaging.")
    }</div>`;
    refreshIcons();
    return;
  }

  el.innerHTML = `
    ${chatHeaderHtml(c)}
    ${pinnedBannerHtml(c)}
    <div class="messages-scroll-wrap">
      <div class="messages-scroll scroll" id="messages-scroll">${messagesTimelineHtml(c)}</div>
    </div>
    ${composerHtml()}
  `;

  applyConvoThemeToScroll(c);

  if (isMobile()){
    const back = document.getElementById("back-btn");
    if (back){ back.style.display = "flex"; }
  }

  bindMessagesScroll(c);
  bindComposer(c);
  bindChatSearchInput(c);

  refreshIcons();
}

// Applies this conversation's theme overrides (falling back to the global
// Appearance settings for any field the conversation hasn't overridden) —
// scoped entirely to #messages-scroll via inline styles/data-attrs/classes,
// so it never touches <html> or leaks into any other conversation. This is
// the single place per-conversation theming actually takes visual effect;
// nothing else duplicates this logic.
function applyConvoThemeToScroll(c){
  const scrollEl = document.getElementById("messages-scroll");
  if (!scrollEl) return;
  const theme = c.theme || {};

  // Accent: swap in the chosen preset's colors as scoped CSS custom
  // properties, so "me" bubbles / links / etc. inside this chat pick them up
  // via the same var(--primary)/var(--primary-2) every component already uses.
  if (theme.accent && PALETTES[theme.accent]){
    scrollEl.style.setProperty("--primary", PALETTES[theme.accent].primary);
    scrollEl.style.setProperty("--primary-2", PALETTES[theme.accent].primary2);
  } else {
    scrollEl.style.removeProperty("--primary");
    scrollEl.style.removeProperty("--primary-2");
  }

  // Background: conversation override, else the global default.
  const bgKey = theme.background || STORE.settings.chatBackground;
  const bg = CHAT_BG_OPTIONS.find(b => b.key === bgKey) || CHAT_BG_OPTIONS[0];
  scrollEl.style.background = bg.css === "transparent" ? "" : bg.css;

  // Message style: toggles the existing .style-compact rules (see CSS).
  scrollEl.classList.toggle("style-compact", (theme.messageStyle || STORE.settings.messageStyle) === "compact");

  // Density: reuses the same --density-* tokens as the global setting,
  // just scoped to this element instead of <html>.
  if (theme.density) scrollEl.setAttribute("data-density", theme.density);
  else scrollEl.removeAttribute("data-density");
}

/* Re-render only the message timeline — used for actions (send, react, edit,
   status transitions, search navigation) that shouldn't rebuild the header,
   composer, or lose scroll/focus state unnecessarily. */
function renderChatMessagesOnly(){
  const c = findConvo(STORE.activeConvoId);
  const scrollEl = document.getElementById("messages-scroll");
  if (!c || !scrollEl) { renderChat(); return; }
  const wasNearBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120;
  scrollEl.innerHTML = messagesTimelineHtml(c);
  if (wasNearBottom) scrollEl.scrollTop = scrollEl.scrollHeight;
  refreshIcons();
}

function renderChatBannerOnly(){
  const banner = document.getElementById("new-msg-banner");
  if (banner) banner.remove();
}

function renderComposerOnly(){
  const wrap = document.querySelector(".composer-wrap");
  if (!wrap) { return; }
  const c = findConvo(STORE.activeConvoId);
  wrap.outerHTML = composerHtml();
  bindComposer(c);
  refreshIcons();
}

function bindMessagesScroll(c){
  const el = document.getElementById("chat-root");
  const scrollEl = document.getElementById("messages-scroll");
  if (!scrollEl) return;

  // Preserve reading position: only snap to bottom automatically when the
  // conversation is freshly opened or the person is already near the
  // bottom. Otherwise leave their scroll position alone.
  const flag = STORE.scrollFlags[c.id];
  if (!flag || flag.stickToBottom){
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }
  STORE.scrollFlags[c.id] = { stickToBottom: true };

  scrollEl.addEventListener("scroll", () => {
    const nearBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120;
    STORE.scrollFlags[c.id] = { stickToBottom: nearBottom };
    if (nearBottom) STORE.newMessageBanner[c.id] = false;

    const showJump = !nearBottom;
    let jumpBtn = document.getElementById("jump-btn");
    if (showJump && !jumpBtn){
      jumpBtn = document.createElement("button");
      jumpBtn.id = "jump-btn";
      jumpBtn.className = "jump-btn";
      jumpBtn.setAttribute("aria-label","Jump to latest message");
      jumpBtn.innerHTML = iconSvg("chevron-down",18);
      jumpBtn.onclick = () => { scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior:"smooth" }); };
      el.appendChild(jumpBtn);
      refreshIcons();
    } else if (!showJump && jumpBtn){
      jumpBtn.remove();
      const banner = document.getElementById("new-msg-banner");
      if (banner) banner.remove();
    }
  });
}

function bindChatSearchInput(c){
  const input = document.getElementById("chat-search-input");
  if (!input) return;
  input.focus();
  input.selectionStart = input.selectionEnd = input.value.length;
  input.addEventListener("input", (e) => actions.setChatSearchQuery(e.target.value));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") actions.navigateChatSearch(e.shiftKey ? "prev" : "next");
    if (e.key === "Escape") actions.toggleChatSearch();
  });
}

function bindComposer(c){
  const input = document.getElementById("composer-input");
  const sendBtn = document.getElementById("send-btn");
  if (!input || !sendBtn) return;

  const updateSendState = () => {
    const has = input.value.trim().length > 0 || STORE.pendingAttachments.some(a => a.progress >= 100);
    sendBtn.classList.toggle("ready", has);
  };
  const doSend = () => {
    actions.sendMessage(c.id, input.value);
    input.value = "";
    input.style.height = "auto";
  };
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
    updateSendState();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  sendBtn.addEventListener("click", doSend);
  updateSendState();

  // Inline per-message edit inputs: focus + Enter/Escape handling.
  // Rendered fresh on every renderChat()/renderChatMessagesOnly() call,
  // so listeners are (re)attached here rather than via delegation.
  c.messages.forEach(m => {
    if (STORE.editingId === m.id){
      const ei = document.getElementById("edit-input-" + m.id);
      if (ei){
        ei.focus();
        ei.selectionStart = ei.selectionEnd = ei.value.length;
        ei.addEventListener("keydown", (e) => {
          if (e.key === "Enter") actions.editMessage(c.id, m.id, ei.value);
          if (e.key === "Escape") actions.setEditing(null);
        });
      }
    }
  });
}

/* ============================================================
   7. RENDER — CONTEXTUAL PANEL (chat info / members / media / files)
   ------------------------------------------------------------
   One content builder, three presentations:
     desktop → docked third column · tablet → floating overlay
     mobile  → dedicated full-screen view (see renderMobileInfo)
   The panel never reserves layout space unless it is open.
   ============================================================ */
function contextualPanelTabs(c){
  const isGroupLike = c.type === "group" || c.type === "channel";
  const tabs = isGroupLike ? [
    { key:"details", icon:"info", label:"About" },
    { key:"members", icon:"users", label: c.type==="channel" ? "Subscribers" : "Members" },
    { key:"media", icon:"image", label:"Media" },
    { key:"files", icon:"file", label:"Files" },
    { key:"links", icon:"link", label:"Links" },
    { key:"permissions", icon:"shield", label:"Permissions" },
    { key:"notifications", icon:"bell", label:"Alerts" },
    { key:"customization", icon:"droplet", label:"Style" },
  ] : [
    { key:"details", icon:"info", label:"Info" },
    { key:"media", icon:"image", label:"Media" },
    { key:"files", icon:"file", label:"Files" },
  ];
  const validKeys = tabs.map(t => t.key);
  if (!validKeys.includes(STORE.panelView)) STORE.panelView = "details";
  return `
    <div class="info-tabs ${isGroupLike?'scrollable':''}">
      ${tabs.map(t => `
        <button class="info-tab ${STORE.panelView===t.key?'active':''}" data-action="setPanelView" data-view="${t.key}">
          ${iconSvg(t.icon,15)}<span>${t.label}</span>
        </button>`).join("")}
    </div>`;
}

// One managed row per member/subscriber inside the Members/Subscribers tab.
// `manage` reflects whether the CURRENT_USER is an admin of this group/channel
// — a frontend approximation of what a backend would actually authorize.
function memberManagedRowHtml(c, m, manage){
  if (!m) return "";
  const role = roleOf(c, m.id);
  const isSelf = m.id === CURRENT_USER.id;
  const menuOpen = STORE.memberMenuId === m.id;
  const noun = c.type === "channel" ? "subscriber" : "member";
  return `
    <div class="member-row member-row-managed">
      ${avatarHtml({ name:m.name, color:m.avatarColor, size:32, status:m.status })}
      <span class="member-name">
        ${esc(m.name)}${isSelf?' (you)':''}
        ${role !== "member" ? `<span class="role-badge ${role}">${role}</span>` : ""}
      </span>
      ${manage && !isSelf ? `
        <div style="position:relative;">
          <button class="icon-btn member-more-btn" data-action="toggleMemberMenu" data-id="${m.id}" aria-label="Member actions">${iconSvg('more-vertical',15)}</button>
          ${menuOpen ? `
            <div class="dropdown-menu" style="right:0; top:36px;">
              ${role !== "admin" ? `<button class="dropdown-item" data-action="setMemberRole" data-convo="${c.id}" data-id="${m.id}" data-role="admin">${iconSvg('shield',14)} Make admin</button>` : ""}
              ${role !== "moderator" ? `<button class="dropdown-item" data-action="setMemberRole" data-convo="${c.id}" data-id="${m.id}" data-role="moderator">${iconSvg('shield',14)} Make moderator</button>` : ""}
              ${role !== "member" ? `<button class="dropdown-item" data-action="setMemberRole" data-convo="${c.id}" data-id="${m.id}" data-role="member">${iconSvg('user',14)} Make member</button>` : ""}
              <div class="dropdown-divider"></div>
              <button class="dropdown-item danger" data-action="removeGroupMember" data-convo="${c.id}" data-id="${m.id}">${iconSvg('user-x',14)} Remove ${noun}</button>
            </div>` : ""}
        </div>` : ""}
    </div>`;
}

function contextualPanelBody(c){
  const title = convoTitle(c);
  const color = convoColor(c);
  const iconName = c.type === "channel" ? "hash" : c.type === "group" ? "users" : null;
  const isGroupLike = c.type === "group" || c.type === "channel";
  const members = c.type === "direct"
    ? [CURRENT_USER, STORE.usersById[c.participantIds[0]]]
    : [CURRENT_USER, ...c.participantIds.map(id => STORE.usersById[id])];

  if (STORE.panelView === "media"){
    return mediaPanelHtml(c);
  }
  if (STORE.panelView === "files"){
    return filePanelHtml(c);
  }

          <option value="everyone" ${p.whoCanEditInfo==='everyone'?'selected':''}>Everyone</option>

      <div class="frontend-note">${iconSvg('alert-triangle',14)}<span>These permissions are a frontend demonstration of the future product model — they are not enforced by a backend.</span></div>`;

  if (STORE.panelView === "notifications"){
    return `

      <div class="frontend-note">${iconSvg('alert-triangle',14)}<span>Notification preferences shown here are local UI state for this demo, not wired to a push service.</span></div>`;
  }
  if (STORE.panelView === "customization"){
    const manage = canManageMembers(c);
    return `
      <div class="info-section-label">${c.type==='channel'?'Channel':'Group'} color</div>
      <div class="color-swatch-row">
        ${GROUP_COLORS.map(col => `<button class="color-swatch-btn ${c.groupAvatarColor===col?'selected':''}" style="background:${col}" data-action="setGroupColor" data-convo="${c.id}" data-color="${col}" ${!manage?'disabled':''} aria-label="Set color ${col}"></button>`).join("")}

  return `
    <div class="info-hero">
      ${avatarHtml({ name:title, color, size:76, iconName })}

function renderInfoPanel(){

// Generic uncontrolled toggle used for structural/demo-only switches inside
// the group info panel (mute, previews, mention-only, etc.) — these are not
// backed by STORE.settings; they just flip their own visual state locally,
// clearly marked via the "frontend demonstration" notes alongside them.
function toggleRowHtml(label, defaultOn){
  const id = "tog-" + label.replace(/\s+/g,'-').toLowerCase() + "-" + Math.random().toString(36).slice(2,6);
  return `
    <div class="toggle-row">
      <span class="toggle-label">${esc(label)}</span>
      <button class="toggle ${defaultOn?'on':''}" id="${id}" role="switch" aria-checked="${defaultOn}" aria-label="${esc(label)}">
        <span class="toggle-knob"></span>
      </button>
    </div>`;
}
function bindToggles(scope){
  scope.querySelectorAll(".toggle[role='switch']:not([data-action])").forEach(btn => {
    btn.addEventListener("click", () => {
      const on = btn.classList.toggle("on");
      btn.setAttribute("aria-checked", on);
    });
  });
}

// Re-render only the info-panel body (keeps search-input focus while typing,
// used by role changes, member search, and permission/customization edits).
function renderInfoPanelBodyOnly(){
  const body = document.getElementById("info-panel-body");
  const c = findConvo(STORE.activeConvoId);
  if (!body || !c) return;
  body.innerHTML = contextualPanelBody(c);
  refreshIcons();
  bindInfoPanelBody(body);
}

function bindInfoPanelBody(scope){
  if (!scope) return;
  bindToggles(scope);
  const search = scope.querySelector("#member-search-input");
  if (search){
    search.addEventListener("input", (e) => actions.setMemberSearch(e.target.value));
    search.addEventListener("keydown", (e) => { if (e.key === "Enter") e.preventDefault(); });
  }
}

// Mobile: the contextual panel becomes its own full-screen view (pattern
// consistent with Settings/Profile) rather than an overlay or docked column.
function renderMobileInfo(){
  const el = document.getElementById("chat-root");
  if (!el) return;
  const c = findConvo(STORE.activeConvoId);
  if (!c){ STORE.mobileView = "list"; render(); return; }
  const label = c.type === "channel" ? "Channel info" : c.type === "group" ? "Group info" : "Chat info";
  el.innerHTML = `
    <div class="subview">
      <div class="subview-header">
        <button class="icon-btn" data-action="mobileBack" aria-label="Back to chat">${iconSvg("chevron-left")}</button>
        <h2 class="subview-title">${label}</h2>
      </div>
      ${contextualPanelTabs(c)}
      <div class="info-panel-body scroll" id="info-panel-body" style="flex:1;padding:0 20px 24px;">${contextualPanelBody(c)}</div>
    </div>`;
  refreshIcons();
  bindInfoPanelBody(document.getElementById("info-panel-body"));
}
