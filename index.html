// Actual calendar date for a given weekday name, relative to today's week.
function dateForDay(day){
  const d=new Date();d.setHours(0,0,0,0);
  d.setDate(d.getDate()+(DAYS.indexOf(day)-todayIdx()));
  return d;
}
// Weekly planner tasks already live permanently in their weekday's slot and have
// their "done" flag cleared automatically when a new calendar week starts (see
// checkWeekRollover) — so a task just sitting in a day's list already "reappears"
// week after week without any extra work. Recurring builds on top of that:
//  - "daily"   -> the moment it's turned on, a linked copy is placed on every
//                 OTHER day of the week too, so it shows up immediately, everywhere.
//  - "custom"  -> same idea, but only for the specific weekdays chosen.
//  - "weekly"  -> needs no propagation at all: it already lives on a single day
//                 and will reappear there every week once "done" resets.
//  - "monthly" -> there's no monthly rollover, so monthly tasks still need to
//                 advance by generating their next dated occurrence on completion.
function propagateRecurringTask(task,day){
  if(!task.recurring||(task.recurring!=="daily"&&task.recurring!=="custom"))return;
  if(!task.recurGroupId)task.recurGroupId=uid();
  const targetDays=task.recurring==="daily"?DAYS.filter(d=>d!==day):(task.recurringDays||[]).filter(d=>d!==day);
  targetDays.forEach(d=>{
    if(!state.weekTasks[d])state.weekTasks[d]=[];
    const already=state.weekTasks[d].some(t=>t.recurGroupId===task.recurGroupId);
    if(already)return;
    state.weekTasks[d].push({...task,id:uid(),done:false});
  });
}
function handleRecurringTask(task,day){
  if(task.recurring!=="monthly")return; // daily/weekly/custom persist in place via checkWeekRollover
  const base=task.dueDate?new Date(task.dueDate+"T00:00:00"):dateForDay(day);
  const next=new Date(base);
  next.setMonth(next.getMonth()+1);
  const nextDay=DAYS[(next.getDay()+6)%7]; // JS getDay(): Sun=0..Sat=6 -> our Mon-first index
  const nextDueDate=next.toISOString().slice(0,10);
  const newTask={...task,id:uid(),done:false,dueDate:nextDueDate};
  if(!state.weekTasks[nextDay])state.weekTasks[nextDay]=[];
  state.weekTasks[nextDay].push(newTask);
}
function applyTimetableToPlanner(){
  const tt=state.timetable;if(!tt||!tt.blocks)return;
  // Clear out tasks previously generated from the timetable so re-applying syncs cleanly
  // instead of duplicating blocks every time the person hits Apply.
  DAYS.forEach(d=>{state.weekTasks[d]=(state.weekTasks[d]||[]).filter(t=>!t.fromTimetable);});
  tt.blocks.forEach(b=>{
    b.days.forEach(d=>{
      if(!state.weekTasks[d])state.weekTasks[d]=[];
      state.weekTasks[d].push({id:uid(),text:b.name,done:false,priority:b.priority,duration:b.duration,tag:b.tag,dueDate:null,recurring:null,time:b.time,fromTimetable:true});
    });
  });
}
function onKeyDown(e){
  if(e.key==="Escape"){document.getElementById("mobileNav")?.classList.remove("open");document.getElementById("mobileNavOverlay")?.classList.remove("open");document.getElementById("mobileSearchOverlay")?.classList.remove("open");document.getElementById("searchResults")?.classList.remove("show");}
  if(e.ctrlKey||e.metaKey){
    switch(e.key.toLowerCase()){
      case'k':e.preventDefault();document.getElementById("globalSearch")?.focus();break;
      case'z':e.preventDefault();if(e.shiftKey)redo();else undo();break;
      case'n':e.preventDefault();{const day=DAYS[todayIdx()];const text=prompt("Quick add task:");if(text){state.weekTasks[day].push({id:uid(),text,done:false,priority:"Medium",duration:30,tag:"Personal",dueDate:null,recurring:null});saveHistory();persist();render();}}break;
      case'1':case'2':case'3':case'4':case'5':case'6':case'7':case'8':case'9':e.preventDefault();const idx=parseInt(e.key)-1;if(NAV[idx])setState({tab:NAV[idx].id});break;
    }
  }
}
function bindDragReorder(containerId,itemAttr,onReorder){
  const container=document.getElementById(containerId);if(!container)return;
  let dragEl=null;
  container.querySelectorAll(`[${itemAttr}]`).forEach(item=>{
    // Mouse-based native HTML5 drag (desktop)
    item.addEventListener("dragstart",()=>{dragEl=item;setTimeout(()=>item.classList.add("dragging"),0);});
    item.addEventListener("dragend",()=>{item.classList.remove("dragging");container.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));});
    item.addEventListener("dragover",e=>{e.preventDefault();if(item!==dragEl)item.classList.add("drag-over");});
    item.addEventListener("dragleave",()=>item.classList.remove("drag-over"));
    item.addEventListener("drop",e=>{
      e.preventDefault();item.classList.remove("drag-over");
      if(!dragEl||dragEl===item)return;
      const fromId=dragEl.getAttribute(itemAttr),toId=item.getAttribute(itemAttr);
      onReorder(fromId,toId);
    });
  });
  bindTouchReorder(container,itemAttr,onReorder);
}
// Touch/pointer-based reordering, since native HTML5 drag-and-drop does not fire on
// touchscreens. Activated by pressing and holding the grip handle (data-grip-handle),
// so normal scrolling/tapping on the rest of the row still works untouched.
function bindTouchReorder(container,itemAttr,onReorder){
  let activeItem=null,startY=0,placeholder=null,items=[],itemHeight=0,longPressTimer=null,dragging=false;
  let pendingClientY=null,rafId=null;
  const handles=container.querySelectorAll("[data-grip-handle]");
  handles.forEach(handle=>{
    const item=handle.closest(`[${itemAttr}]`);if(!item)return;
    handle.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse")return; // mouse already covered by native DnD
      // Don't block scrolling yet — only the long-press timer below decides this is a
      // drag, not a scroll-past-the-handle tap. Calling preventDefault this early was
      // eating every scroll gesture that merely started on a grip handle.
      clearTimeout(longPressTimer);
      longPressTimer=setTimeout(()=>{
        dragging=true;
        activeItem=item;
        startY=e.clientY;
        items=Array.from(container.querySelectorAll(`[${itemAttr}]`));
        itemHeight=item.offsetHeight;
        item.classList.add("dragging");
        item.style.position="relative";
        item.style.zIndex="50";
        item.style.pointerEvents="none";
        placeholder=document.createElement("div");
        placeholder.style.height=itemHeight+"px";
        placeholder.style.border="2px dashed "+(state.accent||"#6366F1");
        placeholder.style.borderRadius="10px";
        placeholder.style.marginBottom="6px";
        placeholder.style.opacity="0.5";
        item.parentNode.insertBefore(placeholder,item.nextSibling);
        if(navigator.vibrate)navigator.vibrate(12);
      },280);
    },{passive:true});
    handle.addEventListener("pointermove",e=>{
      if(!dragging||!activeItem)return;
      e.preventDefault();
      pendingClientY=e.clientY;
      // Batch the DOM reads/writes into a single rAF per frame instead of running
      // getBoundingClientRect() on every sibling for every pointermove event (which can
      // fire far faster than the screen refreshes and forces a layout each time).
      if(rafId==null){
        rafId=requestAnimationFrame(()=>{
          rafId=null;
          if(!dragging||!activeItem||pendingClientY==null)return;
          const dy=pendingClientY-startY;
          activeItem.style.transform=`translateY(${dy}px)`;
          activeItem.style.transition="none";
          const siblings=items.filter(x=>x!==activeItem);
          let target=null;
          for(const sib of siblings){
            const rect=sib.getBoundingClientRect();
            if(pendingClientY<rect.top+rect.height/2){target=sib;break;}
          }
          if(target){if(target!==placeholder.nextSibling)target.parentNode.insertBefore(placeholder,target);}
          else{activeItem.parentNode.appendChild(placeholder);}
        });
      }
    },{passive:false});
    const finish=e=>{
      clearTimeout(longPressTimer);
      if(rafId!=null){cancelAnimationFrame(rafId);rafId=null;}
      pendingClientY=null;
      if(!dragging||!activeItem){dragging=false;return;}
      e.preventDefault();
      activeItem.style.transform="";
      activeItem.style.position="";
      activeItem.style.zIndex="";
      activeItem.style.pointerEvents="";
      activeItem.classList.remove("dragging");
      const toEl=placeholder.nextSibling&&placeholder.nextSibling.hasAttribute&&placeholder.nextSibling.hasAttribute(itemAttr)?placeholder.nextSibling:(placeholder.previousSibling&&placeholder.previousSibling.hasAttribute&&placeholder.previousSibling.hasAttribute(itemAttr)?placeholder.previousSibling:null);
      placeholder.remove();
      if(toEl&&toEl!==activeItem){
        const fromId=activeItem.getAttribute(itemAttr),toId=toEl.getAttribute(itemAttr);
        onReorder(fromId,toId);
      }
      activeItem=null;placeholder=null;dragging=false;
    };
    handle.addEventListener("pointerup",finish);
    handle.addEventListener("pointercancel",finish);
  });
}
function reorderById(arr,fromId,toId){
  const fromIdx=arr.findIndex(x=>x.id===fromId),toIdx=arr.findIndex(x=>x.id===toId);
  if(fromIdx<0||toIdx<0)return arr;
  const [moved]=arr.splice(fromIdx,1);arr.splice(toIdx,0,moved);return arr;
}
function bindTabEvents(){
  if(state.tab==="habits")bindDragReorder("habitsList","data-habit-id",(fromId,toId)=>{reorderById(state.habits,fromId,toId);saveHistory();persist();render();showToast("Habit reordered","info");});
  DAYS.forEach(d=>{const reorder=(fromId,toId)=>{reorderById(state.weekTasks[d],fromId,toId);saveHistory();persist();render();};bindDragReorder(`tasksList-${d}`,"data-task-id",reorder);bindDragReorder(`tasksList-${d}-m`,"data-task-id",reorder);});
  const gs=document.getElementById("globalSearch");
  if(gs){gs.addEventListener("input",e=>renderSearchResults(e.target.value,false));gs.addEventListener("focus",e=>{if(e.target.value)renderSearchResults(e.target.value,false);});}
  const mgs=document.getElementById("mobileGlobalSearch");
  if(mgs)mgs.addEventListener("input",e=>renderSearchResults(e.target.value,true));
  const hi=document.getElementById("newHabitInput");if(hi){hi.addEventListener("input",e=>{state.drafts.newHabit=e.target.value;persist();});hi.addEventListener("keydown",e=>{if(e.key==="Enter"){document.querySelector('[data-action="addHabit"]')?.click();}});}
  const gi=document.getElementById("newGoalInput");if(gi)gi.addEventListener("input",e=>{state.drafts.newGoal=e.target.value;persist();});
  document.querySelectorAll(".day-draft").forEach(inp=>{inp.addEventListener("input",e=>{state.drafts[inp.dataset.day]=e.target.value;persist();});inp.addEventListener("keydown",e=>{if(e.key==="Enter"){inp.parentElement.querySelector('[data-action="addTask"]')?.click();}});});
  document.querySelectorAll(".goal-range").forEach(r=>{r.addEventListener("input",e=>{const g=state.goals.find(g=>g.id===r.dataset.id);if(g){const wasComplete=isGoalComplete(g);g.progress=+e.target.value;document.getElementById("goal-progress-"+r.dataset.id).textContent=g.progress+"% complete";const nowComplete=isGoalComplete(g);if(nowComplete&&!wasComplete){addXp(10);celebrateGoal(g);render();}else{if(!nowComplete&&wasComplete)g.celebrated=false;persist();}}});});
  const lang=document.getElementById("languageSelect");if(lang)lang.addEventListener("change",e=>{state.language=e.target.value;document.documentElement.lang=e.target.value;persist();render();showToast("Language preference saved. Full automatic translation requires a connected translation service.","info");});
  const cac=document.getElementById("customAccentColor");if(cac)cac.addEventListener("input",e=>{setState({accent:e.target.value});});
  const avu=document.getElementById("avatarUploadInput");if(avu)avu.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;compressImageFile(f,320,0.85).then(dataUrl=>{setState({avatarImage:dataUrl});showToast("Profile photo updated","success");}).catch(()=>showToast("Couldn't read that image","error"));e.target.value="";});
  const bgu=document.getElementById("bgUploadInput");if(bgu)bgu.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;compressImageFile(f,1600,0.8).then(dataUrl=>{setState({bgImage:dataUrl});showToast("Background updated","success");}).catch(()=>showToast("Couldn't read that image","error"));e.target.value="";});
  const jii=document.getElementById("journalImageInput");if(jii)jii.addEventListener("change",async e=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length)return;
    const isDaily=jii.dataset.journalType==="daily";
    const key=jii.dataset.journalKey;
    const store=isDaily?state.dailyJournals:state.weeklyJournals;
    if(!store[key])store[key]={note:"",gratitude:"",lessons:"",mood:3,images:[]};
    if(!store[key].images)store[key].images=[];
    const captionInput=document.getElementById("journalImageCaption");
    const caption=(captionInput?.value||"").trim();
    const status=document.getElementById("journalUploadStatus");
    // Compressed one at a time (not in parallel) so a batch of large photos doesn't spike
    // memory/CPU all at once — each is downscaled to thumbnail-grid size (900px, 0.72
    // quality), which keeps stored entries small and the gallery grid fast to render/scroll.
    let added=0;
    for(let i=0;i<files.length;i++){
      if(status)status.textContent=`Processing photo ${i+1} of ${files.length}…`;
      try{
        const dataUrl=await compressImageFile(files[i],900,0.72);
        store[key].images.push({url:dataUrl,caption:files.length===1?caption:(caption?`${caption} (${i+1})`:"")});
        added++;
      }catch(err){/* skip unreadable file, continue with the rest */}
    }
    if(status)status.textContent="";
    e.target.value="";
    if(captionInput)captionInput.value="";
    if(added){persist();render();showToast(added===1?"Photo added to this entry":`${added} photos added`,"success");}
    else showToast("Couldn't read those images","error");
  });
  const zr=document.getElementById("zoomRange");if(zr){zr.addEventListener("input",e=>{const v=parseInt(e.target.value);state.zoomLevel=v;applyZoom();const lbl=document.getElementById("zoomValueLabel");if(lbl)lbl.textContent=v+"%";persist();});}
  if(state.tab==="focus"){startFocusInterval();updateFocusDisplay();}
  if(state.tab==="journal"){document.querySelector(".week-chip.active")?.scrollIntoView({inline:"center",block:"nearest"});}
  if(state.tab==="admin"&&isAdmin()){refreshAdminData();}
}

/* ===================== Init ===================== */
async function init(){
  applyZoom();
  bindGlobalEvents();
  if(getToken()){
    try{state=await loadUserData();}
    catch(e){console.error("Failed to load session:",e);state=null;}
  }
  if(state){history=[];historyIndex=-1;saveHistory();render();startEventReminderChecks();}
  else{state=null;renderLoginPage();}
  startFocusInterval();
}
init();
