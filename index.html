/* ---- Part 6: Global Search Overlay ---- */
function globalSearchResults(){
  const q = STORE.globalSearch.query.trim().toLowerCase();
  if (!q) return { messages:[], people:[], files:[] };
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");

  const messages = [];
  STORE.conversations.forEach(c => {
    c.messages.forEach(m => {
      if (!m.deleted && m.type !== "system" && m.text && m.text.toLowerCase().includes(q)){
        messages.push({ m, c });
      }
    });
  });

  const people = STORE.users.filter(u =>
    u.name.toLowerCase().includes(q) || (u.handle||"").toLowerCase().includes(q)
  );

  const files = [
    ...seedSharedFiles,
    ...seedSharedMedia.filter(f => f.kind !== "image" || q.length >= 3),
  ].filter(f => f.name.toLowerCase().includes(q));

  return { messages: messages.slice(0,12), people: people.slice(0,6), files: files.slice(0,6) };
}

function gsHighlight(text, q){
  if (!q) return esc(text);
  try {
    const re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    return esc(text).replace(re, '<mark class="gs-hit">$1</mark>');
  } catch(e){ return esc(text); }
}

function renderGlobalSearch(){
  let root = document.getElementById("global-search-root");
  if (!root){
    root = document.createElement("div");
    root.id = "global-search-root";
    document.body.appendChild(root);
  }
  if (!STORE.globalSearch.open){ root.innerHTML = ""; return; }
  const q = STORE.globalSearch.query;
  const tab = STORE.globalSearch.tab;
  root.innerHTML = `
    <div class="global-search-overlay" id="gs-overlay">
      <div class="global-search-card" role="dialog" aria-modal="true" aria-label="Search">
        <div class="global-search-bar">
          ${iconSvg("search", 19)}
          <input class="global-search-input" id="gs-input" type="text" placeholder="Search messages, people, files…"
            value="${esc(q)}" autocomplete="off" spellcheck="false" />
          ${q ? `<button class="global-search-clear" data-action="gsClear" aria-label="Clear">${iconSvg("x",15)}</button>` : ""}
        </div>
        <div class="gs-tabs">
          ${["all","messages","people","files"].map(t => `
            <button class="gs-tab ${tab===t?'active':''}" data-action="gsTab" data-tab="${t}">
              ${t.charAt(0).toUpperCase()+t.slice(1)}
            </button>`).join("")}
        </div>
        <div class="gs-body scroll" id="gs-body"></div>
      </div>
    </div>`;
  renderGlobalSearchBody();
  // bind input directly (not via delegation) to capture every keystroke
  const input = document.getElementById("gs-input");
  if (input){
    input.addEventListener("input", e => actions.setGlobalSearchQuery(e.target.value));
    input.addEventListener("keydown", e => {
      if (e.key === "Escape") actions.closeGlobalSearch();
    });
  }
  // click outside card closes
  document.getElementById("gs-overlay").addEventListener("click", e => {
    if (e.target.id === "gs-overlay") actions.closeGlobalSearch();
  });
  refreshIcons();
}

function renderGlobalSearchBody(){
  const body = document.getElementById("gs-body");
  if (!body) return;
  const q = STORE.globalSearch.query.trim();
  const tab = STORE.globalSearch.tab;

  if (!q){
    // show search history
    const hist = STORE.globalSearch.history;
    body.innerHTML = hist.length ? `
      <div class="gs-history-wrap">
        <div class="gs-history-label">Recent searches</div>
        <div class="gs-chips">
          ${hist.map(h => `
            <button class="gs-chip" data-action="gsHistory" data-q="${esc(h)}">
              ${iconSvg("clock",12)} ${esc(h)}
            </button>`).join("")}
        </div>
        <button class="gs-clear-history" data-action="gsClearHistory">Clear history</button>
      </div>` : `<div class="gs-empty">Type to search messages, people, and files.</div>`;
    refreshIcons();
    return;
  }

  const { messages, people, files } = globalSearchResults();
  const allEmpty = messages.length === 0 && people.length === 0 && files.length === 0;
  if (allEmpty){ body.innerHTML = `<div class="gs-empty">No results for "${esc(q)}"</div>`; return; }

  let html = "";
  const showMessages = tab === "all" || tab === "messages";
  const showPeople   = tab === "all" || tab === "people";
  const showFiles    = tab === "all" || tab === "files";

  if (showPeople && people.length){
    html += `<div class="gs-section-label">People</div>`;
    html += people.map(u => `
      <button class="gs-result" data-action="gsOpenUser" data-id="${u.id}">
        ${avatarHtml({ name:u.name, color:u.avatarColor, size:34, status:u.status })}
        <div class="gs-result-body">
          <div class="gs-result-title">${gsHighlight(u.name, q)}</div>
          <div class="gs-result-sub">${esc(u.handle||"")}</div>
        </div>
      </button>`).join("");
    if (showMessages && messages.length) html += `<div class="gs-divider"></div>`;
  }

  if (showMessages && messages.length){
    html += `<div class="gs-section-label">Messages</div>`;
    html += messages.map(({ m, c }) => {
      const sender = STORE.usersById[m.senderId] || {};
      return `
        <button class="gs-result" data-action="gsOpenMsg" data-convoid="${c.id}" data-msgid="${m.id}">
          ${avatarHtml({ name:convoTitle(c), color:convoColor(c), size:34, iconName: c.type==="channel"?"hash":c.type==="group"?"users":null })}
          <div class="gs-result-body">
            <div class="gs-result-title">${gsHighlight(convoTitle(c), q)}</div>
            <div class="gs-result-sub">${esc(sender.name||"")} · ${gsHighlight((m.text||"").slice(0,80), q)}</div>
          </div>
          <span class="gs-result-time">${formatRelative(m.ts)}</span>
        </button>`;
    }).join("");
    if (showFiles && files.length) html += `<div class="gs-divider"></div>`;
  }

  if (showFiles && files.length){
    html += `<div class="gs-section-label">Files</div>`;
    html += files.map(f => {
      const ico = f.kind==="aud" ? "music" : f.kind==="vid" ? "film" : f.kind==="img" ? "image" : "file-text";
      return `
        <button class="gs-result" data-action="toast" data-msg="File browser — opens ${esc(f.name)}">
          <div class="file-icon-box ${f.kind}" style="flex-shrink:0;">${iconSvg(ico,16)}</div>
          <div class="gs-result-body">
            <div class="gs-result-title">${gsHighlight(f.name, q)}</div>
            <div class="gs-result-sub">${esc(f.ext||f.kind.toUpperCase())} · ${esc(f.size)}</div>
          </div>
          <span class="gs-result-time">${iconSvg("download",13)}</span>
        </button>`;
    }).join("");
  }

  body.innerHTML = html;
  refreshIcons();
}

/* ---- Part 7: Notifications View ---- */
function renderNotifications(){
  const el = document.getElementById("chat-root");
  if (!el || STORE.view !== "notifications") return;

  const filter = STORE.notifFilter;
  let items = STORE.notifItems;
  if (filter === "mentions") items = items.filter(n => n.type === "mention");
  if (filter === "unread")   items = items.filter(n => !n.read);
  const unreadCount = STORE.notifItems.filter(n => !n.read).length;

  function groupByDate(arr){
    const today = new Date().toDateString();
    const yest = new Date(Date.now()-86400000).toDateString();
    const groups = { today: [], yesterday: [], earlier: [] };
    arr.forEach(n => {
      const d = new Date(n.ts).toDateString();
      if (d === today) groups.today.push(n);
      else if (d === yest) groups.yesterday.push(n);
      else groups.earlier.push(n);
    });
    return groups;
  }

  function notifTypeIcon(type){
    const map = { mention:"at-sign", message:"message-circle", join:"user-plus", file:"paperclip" };
    return map[type] || "bell";
  }

  function notifItemHtml(n){
    const sender = STORE.usersById[n.senderId] || {};
    const convo = findConvo(n.convoId);
    const convoName = convo ? convoTitle(convo) : "a conversation";
    const typeLabels = {
      mention: `<strong>${esc(sender.name||"Someone")}</strong> mentioned you in <strong>${esc(convoName)}</strong>`,
      message: `<strong>${esc(sender.name||"Someone")}</strong> sent a message in <strong>${esc(convoName)}</strong>`,
      join: `You were added to <strong>${esc(convoName)}</strong>`,
      file: `<strong>${esc(sender.name||"Someone")}</strong> shared a file in <strong>${esc(convoName)}</strong>`,
    };
    return `
      <div class="notif-item ${n.read?'':'unread'}" data-action="openNotif" data-id="${n.id}">
        <div class="notif-type-icon ${n.type}">${iconSvg(notifTypeIcon(n.type), 16)}</div>
        <div class="notif-content">
          <div class="notif-text">${typeLabels[n.type] || esc(n.type)}</div>
          ${n.preview ? `<div class="notif-preview">${esc(n.preview)}</div>` : ""}
        </div>
        <span class="notif-time">${formatRelative(n.ts)}</span>
      </div>`;
  }

  function groupHtml(label, arr){
    if (!arr.length) return "";
    return `<div class="notif-date-group">${label}</div>${arr.map(notifItemHtml).join("")}`;
  }

  const groups = groupByDate(items);
  const bodyHtml = (!groups.today.length && !groups.yesterday.length && !groups.earlier.length)
    ? emptyStateHtml("bell", filter==="unread" ? "All caught up" : "No notifications", filter==="unread" ? "You have no unread notifications." : "Activity, mentions, and alerts will appear here.")
    : `${groupHtml("Today", groups.today)}${groupHtml("Yesterday", groups.yesterday)}${groupHtml("Earlier", groups.earlier)}`;

  el.innerHTML = `
    <div class="subview">
      <div class="subview-header">
        <button class="icon-btn" data-action="setView" data-view="chats" aria-label="Back">${iconSvg("chevron-left")}</button>
        <h2 class="subview-title">Notifications ${unreadCount ? `<span style="font-size:13px;color:var(--text-tertiary);font-weight:400;">(${unreadCount} unread)</span>` : ""}</h2>
      </div>
      <div class="notif-view">
        <div class="notif-toolbar">
          <div class="notif-filters">
            ${["all","mentions","unread"].map(f => `
              <button class="notif-filter-btn ${filter===f?'active':''}" data-action="setNotifFilter" data-filter="${f}">
                ${f.charAt(0).toUpperCase()+f.slice(1)}
              </button>`).join("")}
          </div>
          ${unreadCount ? `<button class="notif-mark-all" data-action="markAllNotifsRead">Mark all read</button>` : ""}
        </div>
        <div class="notif-body scroll">${bodyHtml}</div>
      </div>
    </div>`;
  refreshIcons();
}

/* ============================================================
   12. APP SHELL — full render
   ============================================================ */
function render(){
  autosaveOnRender();
  const app = document.getElementById("app");
  const mobile = isMobile();
  const mode = panelMode();
  const isSubview = SUBVIEWS.includes(STORE.view);

  // Desktop/tablet: nav rail always present (collapsible via width transition).
  // Mobile: nav rail is replaced entirely by the bottom mobile-nav bar.
  const showNavRail = !mobile;
  const showList = !isSubview && (!mobile || STORE.mobileView === "list");
  const showChatOrSubview = isSubview || (!mobile || STORE.mobileView === "chat" || STORE.mobileView === "info");
  // Contextual panel only ever takes real layout space on desktop, where it docks
  // as the third column; on tablet it floats as an overlay; on mobile it becomes
  // its own full screen. In every case it consumes zero space until opened.
  const showInfoPanel = mode === "desktop" && MAIN_VIEWS.includes(STORE.view) && STORE.panelOpen && !!findConvo(STORE.activeConvoId);
  const showScrim = mode === "tablet" && MAIN_VIEWS.includes(STORE.view) && STORE.panelOpen && !!findConvo(STORE.activeConvoId);

  app.innerHTML = `
    ${showNavRail ? renderNavRail() : ""}
    ${(!mobile && STORE.sidebarCollapsed) ? `<button class="rail-expand-btn" data-action="toggleSidebar" aria-label="Expand sidebar" title="Expand sidebar">${iconSvg('menu')}</button>` : ""}
    ${showList ? `<div class="convo-list" id="convo-list-root"></div>` : ""}
    ${showChatOrSubview ? `<div class="chat-panel" id="chat-root"></div>` : ""}
    ${showScrim ? `<div class="panel-scrim" data-action="closePanel"></div>` : ""}
    ${(showInfoPanel || mode === "tablet") ? `<div id="info-panel-root"></div>` : ""}
  `;

  if (showList) renderConvoList();

  if (STORE.view === "settings") renderSettings();
  else if (STORE.view === "profile") renderProfile();
  else if (STORE.view === "notifications") renderNotifications();
  else if (STORE.view === "saved") renderPlaceholderView("saved", "bookmark", "Saved messages", "Messages you save for later will appear here.");
  else if (mobile && STORE.mobileView === "info") renderMobileInfo();
  else if (showChatOrSubview) renderChat();

  if (mode === "tablet") renderInfoPanel(); // overlay: rendered but only visible while panelOpen
  else if (showInfoPanel) renderInfoPanel();

  renderMobileNav();
  renderProfilePopup();
  renderGlobalSearch();   // Part 6: overlay search (noop when closed)
  renderMediaViewer();    // Part 8: lightbox (noop when closed)
  refreshIcons();
}

/* ============================================================
   12b. RENDER — MODALS (create group/channel wizard, invites)
   ------------------------------------------------------------
   A single #modal-root overlay, driven entirely by STORE.modal /
   STORE.wizard. On mobile it expands to a full screen (see the
   RESPONSIVE block) instead of a squeezed centered dialog.
   ============================================================ */
function renderModal(){
  const root = document.getElementById("modal-root");
  if (!root) return;
  if (!STORE.modal){ root.innerHTML = ""; return; }
  let inner = "";
  if (STORE.modal.type === "createFlow" && STORE.wizard){
    inner = createFlowModalHtml();
  } else if (STORE.modal.type === "invite"){
    const c = findConvo(STORE.modal.convoId);
    if (!c){ STORE.modal = null; root.innerHTML = ""; return; }
    inner = inviteModalHtml(c);
  } else if (STORE.modal.type === "editProfile"){
    inner = profileEditModalHtml();
  } else if (STORE.modal.type === "newDirect"){
    inner = newDirectModalHtml();
  } else {
    root.innerHTML = "";
    return;
  }
  root.innerHTML = `<div class="modal-scrim">${inner}</div>`;
  refreshIcons();
  bindModalInputs();
}

function bindModalInputs(){
  const nameInput = document.getElementById("wizard-name");
  if (nameInput){
    nameInput.addEventListener("input", (e) => { STORE.wizard.name = e.target.value; });
    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter"){ e.preventDefault(); actions.wizardNext(); } });
  }
  const descInput = document.getElementById("wizard-desc");
  if (descInput) descInput.addEventListener("input", (e) => { STORE.wizard.description = e.target.value; });
  const memberSearch = document.getElementById("wizard-member-search");
  if (memberSearch){
    memberSearch.addEventListener("input", (e) => actions.wizardSetMemberSearch(e.target.value));
    memberSearch.addEventListener("keydown", (e) => { if (e.key === "Enter") e.preventDefault(); });
  }
  const newDirectSearch = document.getElementById("new-direct-search");
  if (newDirectSearch){
    newDirectSearch.addEventListener("input", (e) => actions.setNewDirectQuery(e.target.value));
    newDirectSearch.addEventListener("keydown", (e) => { if (e.key === "Enter") e.preventDefault(); });
  }
  const sendPerm = document.getElementById("wizard-send-perm");
  if (sendPerm) sendPerm.addEventListener("change", (e) => { STORE.wizard.permissions.whoCanSend = e.target.value; });
  const inviteLinkInput = document.getElementById("invite-link-input");
  if (inviteLinkInput) inviteLinkInput.addEventListener("click", () => inviteLinkInput.select());

  // profile edit fields
  const peName = document.getElementById("pe-name");
  if (peName) peName.addEventListener("input", (e) => actions.updateProfileDraft("name", e.target.value));
  const peHandle = document.getElementById("pe-handle");
  if (peHandle) peHandle.addEventListener("input", (e) => actions.updateProfileDraft("handle", e.target.value));
  const peStatus = document.getElementById("pe-status");
  if (peStatus) peStatus.addEventListener("input", (e) => actions.updateProfileDraft("statusMessage", e.target.value));
  const peBio = document.getElementById("pe-bio");
  if (peBio){
    peBio.addEventListener("input", (e) => {
      actions.updateProfileDraft("bio", e.target.value);
      const counter = document.getElementById("pe-bio-count");
      if (counter) counter.textContent = `${e.target.value.length}/160`;
    });
  }
}

// Clicking the dimmed backdrop (not the card itself) closes the modal —
// checked by exact target so clicks inside the card never bubble-close it.
document.body.addEventListener("click", (e) => {
  if (e.target.classList && e.target.classList.contains("modal-scrim")) actions.closeModal();
});
document.body.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && STORE.modal) actions.closeModal();
});

/* ============================================================
   13. EVENT DELEGATION
   ------------------------------------------------------------
   One listener on document.body handles all [data-action] clicks,
   so newly-rendered DOM never needs re-binding.
   ============================================================ */
document.body.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const action = t.dataset.action;

  switch(action){
    case "setView": actions.setView(t.dataset.view); break;
    case "setFilter": actions.setFilter(t.dataset.filter); break;
    case "setPalette": actions.setPalette(t.dataset.palette); break;
    case "togglePanel": actions.togglePanel(); break;
    case "closePanel": actions.closePanel(); break;
    case "setPanelView": actions.setPanelView(t.dataset.view); break;
    case "toggleSidebar": actions.toggleSidebar(); break;
    case "mobileBack": actions.mobileBack(); break;
    case "openConvo": actions.openConversation(t.dataset.id); break;
    case "togglePin": actions.togglePin(t.dataset.id || STORE.activeConvoId); break;
    case "toggleMute": actions.toggleMute(t.dataset.id || STORE.activeConvoId); break;
    case "replyTo": {
      const c = findConvo(STORE.activeConvoId);
      const m = c && c.messages.find(m => m.id === t.dataset.msgid);
      if (m) actions.setReplyTo(m);
      break;
    }
    case "cancelReply": actions.clearReplyTo(); break;
    case "editMsg": actions.setEditing(t.dataset.msgid); break;
    case "cancelEdit": actions.setEditing(null); break;
    case "saveEdit": {
      const ei = document.getElementById("edit-input-" + t.dataset.msgid);
      if (ei) actions.editMessage(STORE.activeConvoId, t.dataset.msgid, ei.value);
      break;
    }
    case "deleteMsg": actions.deleteMessage(STORE.activeConvoId, t.dataset.msgid); break;
    case "newConvo": {
      if (STORE.view === "communities") actions.openCreateFlow("group");
      else if (STORE.view === "channels") actions.openCreateFlow("channel");
      else actions.openNewDirect();
      break;
    }
    case "callVoice": actions.pushToast("Voice call — connects via backend calling service", "info"); break;
    case "callVideo": actions.pushToast("Video call — connects via backend calling service", "info"); break;
    case "attach": actions.pushToast("Attach file — opens file picker", "info"); break;
    case "emoji": actions.pushToast("Emoji picker", "info"); break;
    case "voiceMsg": actions.pushToast("Voice message — hold to record", "info"); break;
    case "archiveConvo": actions.toggleArchive(t.dataset.id || STORE.activeConvoId); break;
    case "toggleFavorite": actions.toggleFavorite(t.dataset.id || STORE.activeConvoId); break;
    case "toggleFolderMenu": actions.toggleFolderMenu(t.dataset.id); break;
    case "setFolder": actions.setFolder(t.dataset.id, t.dataset.folder); break;
    case "setActiveFolder": actions.setActiveFolder(t.dataset.folder); break;
    case "setSortBy": actions.setSortBy(t.dataset.sort); break;
    case "addMember": actions.openAddMembers(STORE.activeConvoId); break;
    case "editProfile": actions.openProfileEdit(); break;
    case "signOut": authActions.logout(); break;
    case "toast": actions.pushToast(t.dataset.msg, "info"); break;
    case "authSetScreen": authActions.setScreen(t.dataset.screen); break;
    case "resendVerification": authActions.resendVerification(); break;
    case "toggleChatSearch": actions.toggleChatSearch(); break;
    case "chatSearchNav": actions.navigateChatSearch(t.dataset.dir); break;
    case "toggleHeaderMenu": actions.toggleHeaderMenu(); break;
    case "toggleMessageMenu": actions.toggleMessageMenu(t.dataset.msgid); break;
    case "toggleReactionPicker": actions.toggleReactionPicker(t.dataset.msgid); break;
    case "addReaction": actions.toggleReaction(STORE.activeConvoId, t.dataset.msgid, t.dataset.emoji); break;
    case "forwardMsg": actions.forwardMessage(t.dataset.msgid); break;
    case "copyMsg": actions.copyMessage(t.dataset.msgid); break;
    case "pinMsg": actions.togglePinMessage(STORE.activeConvoId, t.dataset.msgid); break;
    case "toggleAttachMenu": actions.toggleAttachMenu(); break;
    case "queueAttachment": actions.queuePendingAttachment(t.dataset.kind); break;
    case "removeAttachment": actions.removePendingAttachment(t.dataset.id); break;
    case "toggleRecording": actions.toggleRecording(); break;
    case "gifSticker": actions.pushToast("GIF & sticker picker — connects to a media provider", "info"); break;
    case "jumpToNewest": actions.jumpToNewest(); break;
    case "jumpToPinned": actions.jumpToMessage(t.dataset.msgid); break;

    /* ---- PART 5: settings, profile, per-conversation chat theme ---- */
    case "setThemeMode": actions.setThemeMode(t.dataset.mode); break;
    case "setDensity": actions.setDensity(t.dataset.density); break;
    case "setFontSize": actions.setFontSize(t.dataset.size); break;
    case "setMessageStyle": actions.setMessageStyle(t.dataset.style); break;
    case "clearCustomAccent": actions.clearCustomAccent(t.dataset.slot); break;
    case "setChatBackground": actions.setChatBackground(t.dataset.bg); break;
    case "toggleNotificationSetting": actions.toggleNotificationSetting(t.dataset.key); break;
    case "togglePrivacySetting": actions.togglePrivacySetting(t.dataset.key); break;
    case "setPrivacyValue": actions.setPrivacyValue(t.dataset.key, t.dataset.value); break;
    case "toggleChatSetting": actions.toggleChatSetting(t.dataset.key); break;
    case "setChatValue": actions.setChatValue(t.dataset.key, t.dataset.value); break;
    case "toggleAccessibilitySetting": actions.toggleAccessibilitySetting(t.dataset.key); break;
    case "setSettingsCategory": actions.setSettingsCategory(t.dataset.category); break;
    case "settingsMobileBack": actions.settingsMobileBack(); break;
    case "clearLocalData": {
      if (confirm("Reset your appearance settings and profile customization to defaults? This can't be undone.")) actions.clearLocalData();
      break;
    }
    case "toggleProfilePopup": actions.toggleProfilePopup(); break;
    case "setViewFromPopup": actions.closeProfilePopup(); actions.setView(t.dataset.view); break;
    case "closeProfilePopup": actions.closeProfilePopup(); break;
    case "setPresenceStatus": actions.setPresenceStatus(t.dataset.status); break;
    case "openProfileEdit": actions.openProfileEdit(); break;
    case "setProfileDraftField": actions.updateProfileDraft(t.dataset.field, t.dataset.value); renderModal(); break;
    case "saveProfileEdit": actions.saveProfileEdit(); break;
    case "toggleChatThemePopover": actions.toggleChatThemePopover(t.dataset.convo || STORE.activeConvoId); break;
    case "closeChatThemePopover": actions.closeChatThemePopover(); break;
    case "setConvoAccent": actions.setConvoTheme(STORE.activeConvoId, { accent: t.dataset.palette }); break;
    case "setConvoBg": actions.setConvoTheme(STORE.activeConvoId, { background: t.dataset.bg }); break;
    case "setConvoMessageStyle": actions.setConvoTheme(STORE.activeConvoId, { messageStyle: t.dataset.style }); break;
    case "setConvoDensity": actions.setConvoTheme(STORE.activeConvoId, { density: t.dataset.density }); break;
    case "resetConvoTheme": actions.resetConvoTheme(STORE.activeConvoId); break;

    /* ---- PART 4: create-group/channel wizard ---- */
    case "closeModal": actions.closeModal(); break;
    case "wizardBack": actions.wizardBack(); break;
    case "wizardNext": actions.wizardNext(); break;
    case "wizardSetColor": actions.wizardSetColor(t.dataset.color); break;
    case "wizardToggleMember": actions.wizardToggleMember(t.dataset.id); break;
    case "startDirectWith": actions.startDirectWith(t.dataset.userid); break;
    case "wizardSetPrivacy": actions.wizardSetPrivacy(t.dataset.value); break;
    case "createFlowFinish": actions.createFlowFinish(); break;

    /* ---- PART 6: global search ---- */
    case "openGlobalSearch": actions.openGlobalSearch(); break;
    case "gsClear": actions.setGlobalSearchQuery(""); { const i=document.getElementById("gs-input"); if(i){i.value="";i.focus();} } renderGlobalSearchBody(); break;
    case "gsTab": actions.setGlobalSearchTab(t.dataset.tab); break;
    case "gsHistory": actions.globalSearchFromHistory(t.dataset.q); break;
    case "gsClearHistory": actions.globalSearchClearHistory(); break;
    case "gsOpenMsg": actions.globalSearchNavigate(t.dataset.convoid, t.dataset.msgid); break;
    case "gsOpenUser": {
      // find or open DM with this user
      const uid = t.dataset.id;
      const dm = STORE.conversations.find(c => c.type==="direct" && c.participantIds.includes(uid));
      actions.closeGlobalSearch();
      if (dm) actions.openConversation(dm.id);
      else actions.pushToast("Open DM — connects to conversation picker","info");
      break;
    }

    /* ---- PART 7: notifications ---- */
    case "setNotifFilter": actions.setNotifFilter(t.dataset.filter); break;
    case "markAllNotifsRead": actions.markAllNotifsRead(); break;
    case "openNotif": actions.openNotifItem(t.dataset.id); break;

    /* ---- PART 8: media viewer & panel ---- */
    case "openMediaViewer": actions.openMediaViewer(STORE.activeConvoId, parseInt(t.dataset.i)||0); break;
    case "openMediaViewerQuick": actions.openMediaViewer(STORE.activeConvoId, 0); break;
    case "closeMediaViewer": actions.closeMediaViewer(); break;
    case "mediaViewerNav": actions.mediaViewerNav(t.dataset.dir); break;
    case "mediaViewerJump": actions.mediaViewerJump(parseInt(t.dataset.i)||0); break;
    case "setMediaFilter": actions.setMediaPanelFilter(t.dataset.filter); break;
    case "setFileFilter": actions.setFilePanelFilter(t.dataset.filter); break;

    /* ---- PART 4: invitations ---- */
    case "openInvite": actions.openInvite(t.dataset.id); break;
    case "copyInvite": actions.copyInviteLink(t.dataset.convo); break;
    case "shareInvite": actions.shareInvite(t.dataset.convo); break;
    case "viewMembers": actions.openPanelAt("members"); break;
    case "viewPermissions": actions.openPanelAt("permissions"); break;

    /* ---- PART 4: member management + group settings ---- */
    case "toggleMemberMenu": actions.toggleMemberMenu(t.dataset.id); break;
    case "setMemberRole": actions.setMemberRole(t.dataset.convo, t.dataset.id, t.dataset.role); break;
    case "removeGroupMember": actions.removeMemberFromGroup(t.dataset.convo, t.dataset.id); break;
    case "setGroupPrivacy": actions.setGroupPrivacy(t.dataset.convo, t.dataset.value); break;
    case "setGroupColor": actions.setGroupColor(t.dataset.convo, t.dataset.color); break;
    case "leaveGroup": actions.leaveGroup(t.dataset.id); break;
  }
});

// Close transient popovers (message menu, reaction picker, header menu,
// attach menu, chat theme popover) when clicking anywhere outside of them.
document.body.addEventListener("click", (e) => {
  const insideMenu = e.target.closest(".dropdown-menu, .reaction-picker, .chat-theme-popover, [data-action='toggleMessageMenu'], [data-action='toggleReactionPicker'], [data-action='toggleHeaderMenu'], [data-action='toggleAttachMenu'], [data-action='toggleMemberMenu'], [data-action='toggleChatThemePopover'], [data-action='toggleFolderMenu']");
  if (insideMenu) return;
  let changed = false;
  if (STORE.messageMenuId){ STORE.messageMenuId = null; changed = true; }
  if (STORE.reactionPickerId){ STORE.reactionPickerId = null; changed = true; }
  if (STORE.headerMenuOpen){ STORE.headerMenuOpen = false; changed = true; }
  if (STORE.attachMenuOpen){ STORE.attachMenuOpen = false; changed = true; }
  if (STORE.chatThemeConvoId){ STORE.chatThemeConvoId = null; changed = true; }
  if (STORE.folderMenuConvoId){ STORE.folderMenuConvoId = null; changed = true; }
  if (changed && findConvo(STORE.activeConvoId)) renderChat();
  if (STORE.memberMenuId){ STORE.memberMenuId = null; renderInfoPanelBodyOnly(); }
});

window.addEventListener("resize", () => {
  if (AUTH.status === "authenticated") render();
});

// Cmd/Ctrl+K → open global search
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "k"){
    e.preventDefault();
    if (AUTH.status === "authenticated"){
      if (STORE.globalSearch.open) actions.closeGlobalSearch();
      else actions.openGlobalSearch();
    }
  }
  if (e.key === "Escape"){
    if (STORE.globalSearch.open){ actions.closeGlobalSearch(); }
    if (STORE.mediaViewer){ actions.closeMediaViewer(); }
  }
});

/* ============================================================
   14. INIT
   ------------------------------------------------------------
   renderRoot() is the single entry point that decides whether the
   person sees the authentication screens or the application shell.
   Swapping AuthService for a real provider only changes how/when
   AUTH.status flips to "authenticated" — this dispatch is unaffected.
   ============================================================ */
function renderRoot(){
  const appEl = document.getElementById("app");
  const mobileNavEl = document.getElementById("mobile-nav-container");
  if (AUTH.status === "authenticated"){
    document.getElementById("auth-root").style.display = "none";
    appEl.style.display = "flex";
    render();
  } else {
    appEl.style.display = "none";
    mobileNavEl.innerHTML = "";
    renderAuth();
  }
}

// Best-effort save if the tab/window is closed while signed in — catches
// whatever the trailing debounce in autosaveOnRender()/saveUserDataToServer()
// hadn't flushed yet. Uses sendBeacon so it can fire during unload without
// being cancelled the way a normal fetch() can be.
window.addEventListener("beforeunload", () => {
  if (AUTH.status !== "authenticated") return;
  const token = getToken();
  if (!token || !navigator.sendBeacon) return;
  const payload = JSON.stringify({ data: getSyncableData() });
  // sendBeacon always sends POST and can't set custom headers, so the token
  // travels in the URL's query string, hitting the dedicated beacon route
  // (see server.js) rather than the normal PUT /api/me/data endpoint.
  navigator.sendBeacon(
    API_BASE + "/api/me/data/beacon?token=" + encodeURIComponent(token),
    new Blob([payload], { type: "application/json" })
  );
});

/* ============================================================
   BOOT
   ------------------------------------------------------------
   If a session token is already saved (returning visitor), verify it
   against the server and hydrate STORE from their saved data before
   the first paint decides between the auth screens and the app shell.
   Any failure (expired token, unreachable server) falls back to the
   login screen, same as a first-time visitor would see.
   ============================================================ */
(async function boot(){
  const token = getToken();
  if (token){
    try {
      const res = await apiFetch("/api/me");
      const authUser = { id: res.user.id, name: res.user.name, email: res.user.email, username: res.user.username };
      await hydrateFromServer(authUser);
      AUTH.status = "authenticated";
      AUTH.user = authUser;
      AUTH.token = token;
      connectSocket();
    } catch(e){
      setToken(null);
      AUTH.status = "unauthenticated";
    }
  }
  renderRoot();
})();
</script>
